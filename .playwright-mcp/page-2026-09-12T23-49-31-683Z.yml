                      - generic [ref=e1734]:
                        - paragraph [ref=e1735]: "The city public works director or his duly appointed designee may allow stormwater runoff that otherwise is of unacceptable quality or which would be discharged in volumes or at rates in excess of those otherwise allowed by this chapter, to be discharged into drainage facilities off site of the development, provided the owner has demonstrated:"
                        - paragraph [ref=e1736]: (a)
                        - paragraph [ref=e1737]: Off-site drainage facilities and channels leading to them are designed, constructed and maintained in accordance with requirements of this chapter;
                        - paragraph [ref=e1738]: (b)
                        - paragraph [ref=e1739]: Adequate provisions are made for sharing of construction, maintenance and operating cost of facilities as a condition to receiving approval of the stormwater management and sediment control plan; and
                        - paragraph [ref=e1740]: (c)
                        - paragraph [ref=e1741]: It is not feasible to completely manage runoff on site in a manner that meets the design and performance standards found in the Stormwater Design Manuals.
                        - paragraph [ref=e1742]: (Ord. No. 2015-05-04(D), 5/4/15)
                  - listitem [ref=e1743]:
                    - generic [ref=e1746]:
                      - generic [ref=e1747]:
                        - heading "Sec. 3-6-27 - Prohibitions and illicit connections." [level=4] [ref=e1749]
                        - generic [ref=e1751]:
                          - text:     
                          - generic [ref=e1752]:
                            - button " Share Link to section" [ref=e1753] [cursor=pointer]:
                              - generic [ref=e1754]: 
                              - generic [ref=e1755]: Share Link to section
