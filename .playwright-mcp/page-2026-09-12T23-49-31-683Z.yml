                        - paragraph [ref=e1401]: The initial fees associated with the operation of this chapter shall be set annually by city council as part of the annual budget ordinance, or by an amendment thereto. If no amendment to the prior year's fees is proposed or adopted by city council as part of the budget ordinance, then the prior year's fees shall continue in full force and effect. A list of the fees proposed at the enactment of the ordinance codified in this chapter for plan review and other fees associated with this chapter may be obtained from the city public works director or his duly appointed designee.
