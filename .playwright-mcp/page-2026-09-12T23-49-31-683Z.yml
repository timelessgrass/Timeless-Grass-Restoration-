                      - generic [ref=e810]:
                        - paragraph [ref=e811]: (a)
                        - paragraph [ref=e812]: "The following items relate to the general scope of plans required by this chapter:"
                        - paragraph [ref=e813]: (1)
                        - paragraph [ref=e814]: A regional approach to stormwater management is an acceptable alternative to site-specific requirements and is encouraged;
                        - paragraph [ref=e815]: (2)
                        - paragraph [ref=e816]: In developing plans for subdivisions, individual lots in a residential development shall not be considered to be separate land disturbing activities and shall not require individual permits. Instead the subdivision development, as a whole, shall be considered to be a single land disturbing activity. Hydrologic parameters that reflect the ultimate subdivision development shall be used in all engineering calculations;
                        - paragraph [ref=e817]: (3)
                        - paragraph [ref=e818]: If individual lots or sections in a subdivision are being developed by different property owners, all land disturbing activities related to the subdivision shall be covered by the approved stormwater management and sediment control plan for the subdivision. A statement shall be included on the final plat that all activities, including activities by individual lot owners, will be carried out in accordance with the approved stormwater management and sediment control plan for the subdivision;
                        - paragraph [ref=e819]: (4)
                        - paragraph [ref=e820]: For developments that have different planned phases of development, if all phases are covered by the approved master or stormwater management and sediment control plan, one (1) permit will be given for the entire development so that new permits will not be needed for each phase of development;
                        - paragraph [ref=e821]: (5)
                        - paragraph [ref=e822]: Subdivisions, which received preliminary plat or final planned unit development (PUD) approval prior to the effective date of the ordinance codified in this chapter, are exempt from these requirements. Development of new phases of existing subdivisions shall comply with the provisions of this chapter.
                        - paragraph [ref=e823]: (b)
                        - paragraph [ref=e824]: "In subdivisions, the following requirements apply:"
                        - paragraph [ref=e825]: (1)
                        - paragraph [ref=e826]: The design surface runoff across lots shall not have erosive velocities;
                        - paragraph [ref=e827]: (2)
                        - paragraph [ref=e828]: Quantities of surface runoff greater than three (3) cfs that flow through lots shall be collected and conveyed in a system of open channels, closed conduits, or a combination of both;
                        - paragraph [ref=e829]: (3)
                        - paragraph [ref=e830]: Lots should generally be graded in such a manner that surface runoff does not cross adjacent lots before it is collected in a system of open channels, closed conduits, or a combination of both.
                        - paragraph [ref=e831]: (c)
                        - paragraph [ref=e832]: The first floor elevation of any structure must be a minimum of 12 inches above the surrounding finished grade inclusive of the garage, using existing land use conditions.
                        - paragraph [ref=e833]: (d)
                        - paragraph [ref=e834]: For all land disturbing activities, concentrated stormwater runoff leaving a development site must be discharged directly into a well-defined, natural or man-made offsite receiving channel or pipe. If the receiving channel is found to be inadequate, the developer must incorporate measures to either improve the receiving channel to an adequate condition, or detain (retain) runoff on the site to a level that can be accommodated by the receiving channel. Newly constructed channels shall be designed as adequate channels. If treated stormwater runoff is discharged into existing wetlands, the proposed water surface elevation, within and adjacent to the wetlands, must be determined for design conditions.
                        - paragraph [ref=e835]: The development site should be designed to maximize the amount of rainfall that infiltrates into the soils and minimize the amount of direct flow into public drainage facilities, adjoining streets, waterbodies, watercourses, and wetlands, to the extent feasible.
                        - paragraph [ref=e836]: (e)
                        - paragraph [ref=e837]: Design configurations, which create stagnant water conditions, such as hydraulically dead end canals, are prohibited regardless of the type of development.
                        - paragraph [ref=e838]: (Ord. No. 2015-05-04(D), 5/4/15)
