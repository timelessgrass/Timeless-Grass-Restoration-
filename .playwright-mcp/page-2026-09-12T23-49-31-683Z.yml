                      - generic [ref=e1450]:
                        - paragraph [ref=e1451]: (a)
                        - paragraph [ref=e1452]: All stormwater management facilities and BMPs shall be privately owned and maintained unless the city accepts the facility for city ownership and maintenance, which will be allowed only when the system is part of a subdivision, a multiple lot or area plan, or when the improvements are completely contained in a dedicated right-of-way.
                        - paragraph [ref=e1453]: (b)
                        - paragraph [ref=e1454]: All stormwater management measures relying on designated vegetated areas or special site features shall be privately owned and maintained as defined on the stormwater management and sediment control plan.
                        - paragraph [ref=e1455]: (c)
                        - paragraph [ref=e1456]: Most regional stormwater management facilities may be publicly owned and/or maintained, but nothing in this chapter shall be deemed to require such manner of ownership.
                        - paragraph [ref=e1457]: (Ord. No. 2015-05-04(D), 5/4/15)
