                        - paragraph [ref=e1291]: (a)
                        - paragraph [ref=e1292]: "No site development or subdivision plan approval shall be issued or modified without the following items:"
                        - paragraph [ref=e1293]: (1)
                        - paragraph [ref=e1294]: An approved stormwater master plan or stormwater management and sediment control plan, as appropriate;
                        - paragraph [ref=e1295]: (2)
                        - paragraph [ref=e1296]: Right of entry given to the city for city personnel to enter property for emergency maintenance if necessary;
                        - paragraph [ref=e1297]: (3)
