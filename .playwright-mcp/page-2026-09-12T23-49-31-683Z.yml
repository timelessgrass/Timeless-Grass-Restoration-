                      - generic [ref=e635]:
                        - paragraph [ref=e636]: (a)
                        - paragraph [ref=e637]:
                          - text: No person shall conduct any land disturbing activities without having provided for appropriate stormwater management measures that control or manage runoff, in compliance with this chapter, unless exempted in Article I,
                          - link "section 3-6-5" [ref=e638] [cursor=pointer]:
                            - /url: https://library.municode.com/sc/conway/codes/code_of_ordinances?nodeId=TIT3PUWO_CH6STMASECO_ARTIGEPR_S3-6-5EXRE
                          - text: below.
                        - paragraph [ref=e639]: (b)
                        - paragraph [ref=e640]: The provisions of this chapter shall apply throughout the incorporated areas of the City of Conway, South Carolina.
                        - paragraph [ref=e641]: (c)
                        - paragraph [ref=e642]: The city public works director or his duly appointed designee and code enforcement personnel shall be responsible for the coordination and enforcement of the provisions of this chapter.
                        - paragraph [ref=e643]: (d)
                        - paragraph [ref=e644]: "The Horry County Stormwater Design Manual, the SCDHEC BMP Handbook, and the Low Impact Development (LID) in Coastal South Carolina: A Planning and Design Guide shall give guidance to persons preparing stormwater management and sediment control plans, and designing or operating stormwater management systems."
                        - paragraph [ref=e645]: (e)
                        - paragraph [ref=e646]: The application of this chapter and the provisions expressed herein shall be the minimum stormwater management requirements and shall not be deemed a limitation or repeal of any other local requirements authorized by state statute. Where other requirements are more stringent those shall apply. This chapter does not eliminate the necessity for obtaining other permits as may be required by other governmental entities.
                        - paragraph [ref=e647]: (f)
                        - paragraph [ref=e648]: The same design standards will be used for drainage systems, stormwater management facilities, and BMPs that will be either privately or publicly owned or maintained.
                        - paragraph [ref=e649]: (Ord. No. 2015-05-04(D), 5/4/15)
