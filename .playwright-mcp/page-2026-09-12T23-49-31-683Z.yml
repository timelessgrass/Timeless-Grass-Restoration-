                      - generic [ref=e1184]:
                        - paragraph [ref=e1185]: (a)
                        - paragraph [ref=e1186]: "The minimum stormwater quality requirements shall provide stormwater quality management facilities - best management practices (BMPs) - necessary to accomplish the following:"
                        - paragraph [ref=e1187]: (1)
                        - paragraph [ref=e1188]: Design, construct, and maintain stormwater management practices that manage rainfall on-site, and prevent the off-site discharge of one (1) inch of runoff from the site's disturbed area. The requirements for different water quality BMPs recommended for use in the city are contained in the Stormwater Design Manuals;
                        - paragraph [ref=e1189]: (2)
                        - paragraph [ref=e1190]: Provide BMPs to control discharges into the local drainage system of any organic or inorganic matter that shall cause or tend to cause pollution of such waters.
                        - paragraph [ref=e1191]: (b)
                        - paragraph [ref=e1192]: Water quality BMPs must be installed on all developments to control the water quality of the storm runoff from the development site. Acceptable BMPs and information needed for their design and analysis are included in the Stormwater Design Manuals.
                        - paragraph [ref=e1193]: (c)
                        - paragraph [ref=e1194]: Minimization of impervious areas within developments and minimization of impervious areas directly connected to the local drainage system is encouraged as a non-structural BMP for water quality and quantity control.
                        - paragraph [ref=e1195]: (d)
                        - paragraph [ref=e1196]: No debris or other materials shall be deposited in floodplains, watercourses, public streets, highways, sidewalks, or other public thoroughfares, or any other locations on a construction site where such waste may roll, flow, wash, or be blown by wind off of the construction site.
                        - paragraph [ref=e1197]: (Ord. No. 2015-05-04(D), 5/4/15)
