                      - generic [ref=e760]:
                        - paragraph [ref=e761]: "To assist in the design and evaluation of stormwater management facilities in the city, the Horry County Stormwater Design Manual, the SCDHEC BMP Handbook, and the Low Impact Development (LID) in Coastal South Carolina: A Planning and Design Guide are hereby adopted by the city and incorporated by reference into this chapter. Design procedures and criteria are presented for conducting hydrologic and hydraulic evaluations of best management practices (BMPs). Although the intention of the manuals is to establish uniform design practices, they neither replace the need for engineering judgment nor preclude the use of information not presented. Other accepted engineering procedures may be used to conduct hydrologic and hydraulic studies if approved by the city."
                        - paragraph [ref=e762]: (Ord. No. 2015-05-04(D), 5/4/15)
