                        - paragraph [ref=e1482]: "When the city public works director or his duly appointed designee determines that additional storage capacity or water quality control beyond that required of the owner for on-site stormwater management is necessary in order to enhance or provide for the public health, safety and general welfare, to correct unacceptable or undesirable existing conditions or to provide protection in a more desirable fashion for future development, the city public works director or his duly appointed designee may:"
                        - paragraph [ref=e1483]: (a)
                        - paragraph [ref=e1484]: Require that the owner grant any necessary easements over, through or under the owner's property to provide access to or drainage for such a facility;
                        - paragraph [ref=e1485]: (b)
                        - paragraph [ref=e1486]: Require that the owner attempt to obtain from the owners of property over, through or under where the stormwater management facility is to be located, any easements necessary for the construction and maintenance of same (and failing the obtaining of such easement the city may, at its option, assist in such matter by purchase, condemnation, dedication or otherwise, and subject to subsection (c) below, with any cost incurred thereby to be paid by the city); and/or
                        - paragraph [ref=e1487]: (c)
                        - paragraph [ref=e1488]: Participate financially in the construction of such facility to the extent that such facility exceeds the required on-site stormwater management as determined by the city public works director or his duly appointed designee.
                        - paragraph [ref=e1489]: To implement these provisions both the city and developer must be in agreement with the proposed facility that includes the additional storage capacity or water quality control and jointly develop a cost sharing plan which is agreeable to all parties.
                        - paragraph [ref=e1490]: (Ord. No. 2015-05-04(D), 5/4/15)
