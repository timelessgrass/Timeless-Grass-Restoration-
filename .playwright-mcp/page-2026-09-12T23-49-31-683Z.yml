                      - generic [ref=e1766]:
                        - paragraph [ref=e1767]: (a)
                        - paragraph [ref=e1768]: Prohibitions.
                        - paragraph [ref=e1769]: (1)
                        - paragraph [ref=e1770]: It is unlawful for any person, company, corporation, etc., to throw, drain, run, or otherwise discharge to any component of the city's stormwater system, including streets, highways, or rights-of-way; or to cause, permit or suffer to be thrown, drain, run, or allow to seep or otherwise discharge into such system, any organic or inorganic matter that shall cause or tend to cause pollution or blockages to such waters, as provided for in this chapter.
                        - paragraph [ref=e1771]: (2)
                        - paragraph [ref=e1772]: "The city exempts the following from the prohibition provision above:"
                        - paragraph [ref=e1773]: a.
                        - paragraph [ref=e1774]: Water line flushing performed by a government agency, diverted stream flows, rising groundwaters, and polluted groundwater infiltration;
                        - paragraph [ref=e1775]: b.
                        - paragraph [ref=e1776]: Unpolluted pumped groundwater;
                        - paragraph [ref=e1777]: c.
                        - paragraph [ref=e1778]: Discharges from potable water sources, foundation drains, air conditioning condensation, irrigation water, springs, water from crawl space pumps, footing drains, lawn watering, individual residential car washing, flows from riparian habitats and wetlands, and street wash water;
                        - paragraph [ref=e1779]: d.
                        - paragraph [ref=e1780]: Discharges or flows from firefighting;
                        - paragraph [ref=e1781]: e.
                        - paragraph [ref=e1782]: Other unpolluted water.
                        - paragraph [ref=e1783]: (3)
                        - paragraph [ref=e1784]: "Other prohibited discharges. The following discharges from construction sites are prohibited:"
                        - paragraph [ref=e1785]: a.
                        - paragraph [ref=e1786]: Wastewater from washout of concrete, unless managed by an appropriate control.
                        - paragraph [ref=e1787]: b.
                        - paragraph [ref=e1788]: Wastewater from washout and cleanout of stucco, paint, form release oils, curing compounds and other construction materials.
                        - paragraph [ref=e1789]: c.
                        - paragraph [ref=e1790]: Fuels, oils, or other pollutants used in vehicle and equipment operation and maintenance.
                        - paragraph [ref=e1791]: d.
                        - paragraph [ref=e1792]: Soaps or solvents used in vehicle and equipment washing.
                        - paragraph [ref=e1793]: (4)
                        - paragraph [ref=e1794]: In the event of an accidental discharge to the city drainage system of any material or substance other than stormwater runoff, the person concerned shall inform the city public works director or his duly appointed designee immediately of the nature, quantity and time of occurrence of the discharge. The person concerned shall take immediate steps to contain, treat or take other actions to minimize the effects of the discharge on the city drainage system and receiving streams. The person shall also take immediate steps to ensure no recurrence of the discharge.
                        - paragraph [ref=e1795]: (5)
                        - paragraph [ref=e1796]: The public works director or his duly appointed designee may require by written notice that a person responsible for an illegal discharge immediately, or by a specified date, discontinue the discharge and, if necessary, take measures to eliminate the source of the discharge to prevent the occurrence of future illegal discharges.
                        - paragraph [ref=e1797]: (b)
                        - paragraph [ref=e1798]: Requirement to remediate.
                        - paragraph [ref=e1799]: (1)
                        - paragraph [ref=e1800]: Whenever the city public works director or his duly appointed designee finds that a discharge of pollutants is taking place or has occurred which will result in or has resulted in pollution of stormwater, the storm drain system, or water of the U.S., the city public works director or his duly appointed designee may require by written notice to the owner of the property and/or the responsible person that the pollution be remediated and the affected property restored within a specified time pursuant to the provisions below.
                        - paragraph [ref=e1801]: (2)
                        - paragraph [ref=e1802]: The city public works director or his duly appointed designee may require by written notice that any person engaged in any activity and/or owning or operating any facility which may cause or contribute to stormwater pollution, illegal discharges, and/or non-stormwater discharge to the storm drainage system or waters of the U.S., to undertake at said person's expense such monitoring and analyses and furnish such reports to the city of Conway as deemed necessary to determine compliance with this article.
                        - paragraph [ref=e1803]: (c)
                        - paragraph [ref=e1804]: Notification of spills. Notwithstanding other requirements of law, as soon as any person responsible for a facility or operation, or responsible for emergency response for a facility or operation has information of any known or suspected release of materials which are resulting or may result in illegal discharges or pollutants discharging into stormwater, the storm drain system, or water of the U.S. from said facility, said person shall take all necessary steps to ensure the discovery, containment, and cleanup of such release. In the event of such a release of a hazardous material said person shall immediately notify emergency response officials of the occurrence via emergency dispatch services (911). In the event of a release of non-hazardous materials, said person shall notify the city's public works in person or by phone or facsimile no later than 5:00 p.m. of the next business day. Notifications in person or by phone shall be confirmed by written notice addressed and mailed to the city's public works department within three (3) business days of the phone notice. If the discharge of prohibited materials emanates from a commercial or industrial establishment, the owner or operator of such establishment shall also retain an on-site written record of the discharge and the actions taken to prevent its recurrence. Such records shall be retained for at least three (3) years.
                        - paragraph [ref=e1805]: (Ord. No. 2015-05-04(D), 5/4/15)
                  - listitem [ref=e1806]:
