                      - generic [ref=e423]:
                        - paragraph [ref=e424]: For the purpose of this chapter, the following terms, phrases and words, and their derivatives, shall have the meaning given herein.
                        - paragraph [ref=e425]: (1)
                        - paragraph [ref=e426]: Accidental discharge shall mean a discharge prohibited by this chapter into the drainage system, which occurs by chance and without planning or consideration prior to occurrence.
                        - paragraph [ref=e427]: (2)
                        - paragraph [ref=e428]: Adequate channel shall mean a natural or man-made channel or pipe which is capable of conveying the runoff from the design storm events without flooding existing structures or causing property damage.
                        - paragraph [ref=e429]: (3)
                        - paragraph [ref=e430]: Adverse impact shall mean any modifications, alterations, or effects on a feature or characteristics of community lands, water, or wetlands, including their quality, quantity, hydrodynamics, surface area, species or natural uses, which are or may be potentially harmful or injurious to human health, welfare, safety or property, to biological productivity, diversity or stability, or which unreasonably interfere with the enjoyment of life or property, including outdoor recreation. The term includes secondary and cumulative as well as direct impacts.
                        - paragraph [ref=e431]: (4)
                        - paragraph [ref=e432]: As-built plan shall mean a set of engineering or site drawings that delineate the specific permitted stormwater management facility (ies) and BMPs as actually constructed, as outlined in the Stormwater Design Manuals.
                        - paragraph [ref=e433]: (5)
                        - paragraph [ref=e434]: Berm shall mean a mound of soil, either natural or man-made, intended to buffer land uses or limit access.
                        - paragraph [ref=e435]: (6)
                        - paragraph [ref=e436]: Best management practices (BMPs) shall mean a wide range of management procedures, schedules of activities, prohibitions on practices and other management practices which have been demonstrated to effectively control the quality and/or quantity of stormwater runoff and which are compatible with the planned land use. These shall be found in the Stormwater Design Manuals.
                        - paragraph [ref=e437]: (7)
                        - paragraph [ref=e438]: Board of appeals shall mean the City of Conway Zoning Board of Appeals.
                        - paragraph [ref=e439]: (8)
                        - paragraph [ref=e440]: Buffer shall mean an area within a property or site, generally adjacent to and parallel with the property line, either consisting of natural existing vegetation or created by the use of trees, shrubs, and/or berms, designed to continuously limit the view of and sound from the site to adjacent sites or properties. Buffers may also be used to control stormwater runoff from sites.
                        - paragraph [ref=e441]: (9)
                        - paragraph [ref=e442]: City shall mean the City of Conway, South Carolina.
                        - paragraph [ref=e443]: (10)
                        - paragraph [ref=e444]: City council shall mean the duly elected council of the City of Conway.
                        - paragraph [ref=e445]: (11)
                        - paragraph [ref=e446]: City public works director shall mean the public works director or his duly appointed designee of the City of Conway, South Carolina.
                        - paragraph [ref=e447]: (12)
                        - paragraph [ref=e448]: County shall mean Horry County, South Carolina.
                        - paragraph [ref=e449]: (13)
                        - paragraph [ref=e450]: Clean Water Act shall mean the Federal Water Pollution Control Act, as amended (33 U.S.C. 1251 et seq.).
                        - paragraph [ref=e451]: (14)
                        - paragraph [ref=e452]: Conveyance shall mean stormwater features designed for the movement of stormwater through the drainage system, such as concrete pipes, ditches, depressions, swales, channels, etc.
                        - paragraph [ref=e453]: (15)
                        - paragraph [ref=e454]: Culvert shall mean a structure designed to convey a watercourse under a roadway, railway, pedestrian walk, or through an embankment.
                        - paragraph [ref=e455]: (16)
                        - paragraph [ref=e456]: Design report shall mean the report that accompanies the stormwater management and sediment control plan and includes data used for engineering analysis, results of all analysis, design and analysis calculations (including results obtained from computer programs), and other engineering data that would assist the city public works director or his duly appointed designee in evaluating proposed stormwater management facilities.
                        - paragraph [ref=e457]: (17)
                        - paragraph [ref=e458]: Design storm events shall mean the frequency storm used for the design of stormwater management facilities (10-year through 25-year frequency storms).
                        - paragraph [ref=e459]: (18)
                        - paragraph [ref=e460]: Designer shall mean a registered professional who is permitted to prepare plans and studies required by this chapter.
                        - paragraph [ref=e461]: (19)
                        - paragraph [ref=e462]: Detention structure shall mean a permanent stormwater management structure whose primary purpose is to temporarily store stormwater runoff and release the stored runoff at controlled rates.
                        - paragraph [ref=e463]: (20)
                        - paragraph [ref=e464]: Developed land use conditions shall mean the land use conditions according to the current county land use map or proposed site plan. Also the conditions which exist following the completion of the land disturbing activity in terms of topography, vegetation, land use and rate, quality, volume or direction of stormwater runoff.
                        - paragraph [ref=e465]: (21)
                        - paragraph [ref=e466]: Developer shall mean the legal or beneficial owner(s) of a lot of any land included in a proposed development. Developer shall also mean the holder of an option or contract to purchase, or any other person having enforceable proprietary interest in such land.
                        - paragraph [ref=e467]: (22)
                        - paragraph [ref=e468]: "Development activity should generally mean any of the following actions undertaken by a public or private individual or entity:"
                        - paragraph [ref=e469]: a.
                        - paragraph [ref=e470]: The division of a lot, tract or parcel of land into two (2) or more lots, plots, sites, tracts, parcels or other divisions by plat or deed;
                        - paragraph [ref=e471]: b.
                        - paragraph [ref=e472]: The construction, installation or alteration of a structure, impervious surface, or drainage facility;
                        - paragraph [ref=e473]: c.
                        - paragraph [ref=e474]: Any land change, including, without limitation, clearing, tree removal, grubbing, stripping, dredging, grading, excavating, transporting and filling of land; and
                        - paragraph [ref=e475]: d.
                        - paragraph [ref=e476]: Adding, removing, exposing, excavating, leveling, grading, digging, burrowing, dumping, piling, dredging, or otherwise disturbing the soil, vegetation, and mud, sand or rock of a site.
                        - paragraph [ref=e477]: (23)
                        - paragraph [ref=e478]: Easement shall mean a grant of one (1) or more property rights by a property owner to or for use by any person, firm, corporation, the general public, or another person or entity. Not inclusive of fee simple ownership.
                        - paragraph [ref=e479]: (24)
                        - paragraph [ref=e480]: Erosion shall mean the wearing away of land surface by the action of wind, water, gravity, ice, or any combination of those forces.
                        - paragraph [ref=e481]: (25)
                        - paragraph [ref=e482]: Erosion and sediment control shall mean the control of solid material, both mineral and organic, during a land disturbing activity to prevent its transport out of the disturbed area by means of air, water, gravity or ice.
                        - paragraph [ref=e483]: (26)
                        - paragraph [ref=e484]: Exemption shall mean those land disturbing activities that are not subject to the sediment and stormwater requirements contained in this chapter.
                        - paragraph [ref=e485]: (27)
                        - paragraph [ref=e486]: Existing land use conditions shall mean the land use conditions shown on the 2005 aerial photographs available from the county. Engineering hydrologic coefficients to be used for existing land use conditions are contained in the Stormwater Design Manual.
                        - paragraph [ref=e487]: (28)
                        - paragraph [ref=e488]: Filter strips shall mean vegetated sections of land designated to accept runoff as overland sheet flow from upstream developments.
                        - paragraph [ref=e489]: (29)
                        - paragraph [ref=e490]: Flood shall mean a general and temporary condition of partial or complete inundation of land areas from the overflow of inland waters, tidal conditions, or the unusual and rapid accumulation of runoff of surface waters from any source.
                        - paragraph [ref=e491]: (30)
                        - paragraph [ref=e492]: Grading shall mean excavating, filling (including hydraulic fill) or stockpiling of earth material or any combination thereof, including the land in its excavated or filled condition.
                        - paragraph [ref=e493]: (31)
                        - paragraph [ref=e494]: Illicit connection shall mean a connection to the drainage system of any discharge that is not composed entirely of stormwater runoff and is expressly prohibited by this chapter.
                        - paragraph [ref=e495]: (32)
                        - paragraph [ref=e496]: Impervious shall mean the condition of being highly resistant to infiltration by water.
                        - paragraph [ref=e497]: (33)
                        - paragraph [ref=e498]: Imperviousness shall mean the degree to which a site is impervious.
                        - paragraph [ref=e499]: (34)
                        - paragraph [ref=e500]: Impervious surface shall mean a surface that has been highly compacted or covered with a layer of material so that it is highly resistant to infiltration by water. The term includes most conventionally surfaced streets, roofs, sidewalks, parking lots, and other similar structures.
                        - paragraph [ref=e501]: (35)
                        - paragraph [ref=e502]: Infiltration shall mean the passage or movement of water through the soil profile.
                        - paragraph [ref=e503]: (36)
                        - paragraph [ref=e504]: Land disturbing activity shall mean any use of the land by any person that results in a change in the physical characteristics or topography that may cause erosion and contribute to sedimentation and alter the quality and/or quantity of stormwater runoff.
                        - paragraph [ref=e505]: (37)
                        - paragraph [ref=e506]: Lot shall mean a piece, parcel, tract or plot of land intended as a unit for building development or other purpose, or for purposes of sale, rent or lease.
                        - paragraph [ref=e507]: (38)
                        - paragraph [ref=e508]: Maintenance shall mean any action necessary to preserve stormwater management facilities in proper working condition, in order to serve the intended purposes set forth in this chapter and to prevent structural failure of such facilities. Maintenance shall not include actions taken solely for the purpose of enhancing the aesthetics aspects associated with stormwater management facilities and BMPs.
                        - paragraph [ref=e509]: (39)
                        - paragraph [ref=e510]: Minor subdivision shall mean the division of land as defined in the current city subdivision or land development regulations.
                        - paragraph [ref=e511]: (40)
                        - paragraph [ref=e512]: Nonerodible shall mean a material, e.g., natural rock, riprap, concrete, plastic, etc., that will not experience surface wear due to natural forces of wind, water, ice, gravity or a combination of those forces.
                        - paragraph [ref=e513]: (41)
                        - paragraph [ref=e514]: Nonpoint source pollution shall mean pollution contained in stormwater runoff from undefined, diffuse sources.
                        - paragraph [ref=e515]: (42)
                        - paragraph [ref=e516]: 100-year frequency storm shall mean a storm that is capable of producing rainfall expected to be equaled or exceeded on the average of once in 100 years. It also may be expressed as an exceedance probability with a one (1) percent chance of being equaled or exceeded in any given year.
                        - paragraph [ref=e517]: (43)
                        - paragraph [ref=e518]: On-site stormwater management shall mean the design and construction of a facility necessary to control stormwater runoff within and for a single development.
                        - paragraph [ref=e519]: (44)
                        - paragraph [ref=e520]: Owner shall mean the person in whom is vested the fee ownership, dominion, or title of the property. This term may also include a tenant, if chargeable under his lease for the maintenance of the property, and any agent of the owner or tenant including a developer.
                        - paragraph [ref=e521]: (45)
                        - paragraph [ref=e522]: Person shall mean any association, company, corporation, firm, individual, organization, or partnership, singular or plural, of any kind.
                        - paragraph [ref=e523]: (46)
                        - paragraph [ref=e524]: "Person responsible for the land disturbing activity shall mean the:"
                        - paragraph [ref=e525]: a.
                        - paragraph [ref=e526]: Person who has or represents having financial or operational control over the land disturbing activity; and/or
                        - paragraph [ref=e527]: b.
                        - paragraph [ref=e528]: Landowner or person in possession or control of the land who directly or indirectly allowed the land disturbing activity or has benefited from it or who has failed to comply with any provision of this chapter.
                        - paragraph [ref=e529]: (47)
                        - paragraph [ref=e530]: Pollution shall mean the contamination or other alteration of any water's physical, chemical or biological properties, including change in temperature, taste, color, turbidity, or odor of such waters or the discharge of any liquid, gaseous, solid, radioactive, or other substance into any such waters that is harmful, detrimental or injurious to the public health, safety or welfare or to domestic, commercial, industrial, agricultural, recreational, or other legitimate beneficial uses, or to livestock, wild animals, birds, fish or other aquatic life.
                        - paragraph [ref=e531]: (48)
                        - paragraph [ref=e532]: Pre-development shall mean those natural conditions, such as topography, vegetation, land use and rate, volume, or direction of stormwater runoff, which existed prior to any development as defined above.
                        - paragraph [ref=e533]: (49)
                        - paragraph [ref=e534]: Preliminary plat shall mean the preliminary plat pursuant to the current the city subdivision regulations and/or land development regulations.
                        - paragraph [ref=e535]: (50)
                        - paragraph [ref=e536]: Private shall mean property or facilities owned and maintained by individuals, corporations, and other organizations and not by the city.
                        - paragraph [ref=e537]: (51)
                        - paragraph [ref=e538]: Procedure shall mean a plan adopted by the city to implement a regulation or regulations adopted under this chapter, or to carry out other responsibilities as may be required by this chapter or other codes, ordinances, or resolutions of the city.
                        - paragraph [ref=e539]: (52)
                        - paragraph [ref=e540]: Receiving waters shall mean all waters that are identified as blue line streams by the United States Geological Survey (USGS). USGS blue line stream designations can be found at http://maps.waterdata.usgs.gov/mapper/index.html and are represented as a solid blue line, not to include adjacent freshwater marsh/wetland areas.
                        - paragraph [ref=e541]: (53)
                        - paragraph [ref=e542]: Regional stormwater management shall mean the design and construction of a facility necessary to control stormwater runoff within or outside a development and for one (1) or more developments.
                        - paragraph [ref=e543]: (54)
                        - paragraph [ref=e544]: Registered civil engineer shall mean a registered professional engineer in good standing with the South Carolina Board of Registration for Professional Engineers and Land Surveyors.
                        - paragraph [ref=e545]: (55)
                        - paragraph [ref=e546]: Registered land surveyor shall mean a professional registered land surveyor in good standing with the South Carolina Board of Registration for Professional Engineers and Land Surveyors.
                        - paragraph [ref=e547]: (56)
                        - paragraph [ref=e548]: Registered landscape architect shall mean a landscape architect properly registered and licensed to conduct work in South Carolina.
                        - paragraph [ref=e549]: (57)
                        - paragraph [ref=e550]: Responsible personnel shall mean any foreman, superintendent, or similar individual that is the on-site person in charge of land disturbing activities.
                        - paragraph [ref=e551]: (58)
                        - paragraph [ref=e552]: Retention structure shall mean a permanent structure whose primary purpose is to permanently store a given volume of stormwater runoff. Release of the given volume is by infiltration, overflow structures, and/or evaporation.
                        - paragraph [ref=e553]: (59)
                        - paragraph [ref=e554]: SCDHEC shall mean the South Carolina Department of Health and Environmental Control.
                        - paragraph [ref=e555]: (60)
                        - paragraph [ref=e556]: Sediment shall mean solid particulate matter, both mineral and organic, that has been or is being transported by water, air, ice, or gravity from its site of origin.
                        - paragraph [ref=e557]: (61)
                        - paragraph [ref=e558]: Site shall mean any lot, plot, parcel or tract of land.
                        - paragraph [ref=e559]: (62)
                        - paragraph [ref=e560]: Single-family residence - separately built shall mean a noncommercial dwelling that is occupied exclusively by one (1) family and not part of a residential subdivision development.
                        - paragraph [ref=e561]: (63)
                        - paragraph [ref=e562]: Stabilization shall mean the installation of vegetative or structural measures to establish a soil cover to reduce soil erosion by stormwater runoff, wind, ice and gravity.
                        - paragraph [ref=e563]: (64)
                        - paragraph [ref=e564]: Stage work or stage construction shall mean a plan for the staged construction of stormwater facilities where portions of the facilities will be constructed as different stages of the proposed development are started or completed.
                        - paragraph [ref=e565]: (65)
                        - paragraph [ref=e566]: Stop-work order shall mean an order directing the person responsible for the land disturbing activity to cease and desist all or any portion of the work which violates the provisions of this chapter.
                        - paragraph [ref=e567]: (66)
                        - paragraph [ref=e568]: Stormwater master plan shall mean the overall proposed concept for a storm drainage system to serve the entire development including future phases. The master plan shall include stormwater management structures and BMPs, and supporting documentation as specified in this chapter and the Stormwater Management Design Manuals, for each proposed private or public development to the extent permitted by law. Also included are the supporting engineering calculations and results of any computer analysis, if necessary.
                        - paragraph [ref=e569]: (67)
                        - paragraph [ref=e570]: "Stormwater management shall mean, for:"
                        - paragraph [ref=e571]: a.
                        - paragraph [ref=e572]: Quantitative control, a system of vegetative or structural measures, or both, that control the increased volume and rate of stormwater runoff caused by man-made changes to the land; and
                        - paragraph [ref=e573]: b.
                        - paragraph [ref=e574]: Qualitative control, a system of vegetative, structural, or other measures that reduce or eliminate pollutants that might otherwise be carried by stormwater runoff.
                        - paragraph [ref=e575]: (68)
                        - paragraph [ref=e576]: Stormwater management and sediment control plan shall mean the set of drawings and other documents that comprise all of the information and specifications for the drainage systems, structures, concepts and techniques that will be used to control stormwater and sediment as required by this chapter and the Stormwater Design Manuals. Also included are the supporting engineering calculations and results of any computer analysis.
                        - paragraph [ref=e577]: (69)
                        - paragraph [ref=e578]: "Stormwater Design Manuals shall mean the current versions of the Horry County Stormwater Design Manual, the SCDHEC Storm Water Management BMP Handbook, and the Low Impact Development (LID) in Coastal South Carolina: A Planning and Design Guide. The originals of these manuals may be inspected at the office of the city Public Works Department, and copies may be obtained in payment of a reasonable fee. Copies may also be obtained from the websites of Horry County (http://www.horrycounty.org/stormwater), SCDHEC (http://www.scdhec.net/environment), and (http://www.northinlet.sc.edu/LID/) respectively. Those persons seeking reliance on the manuals shall assume the burden of ensuring that the manual to which they refer is the most current version."
                        - paragraph [ref=e579]: (70)
                        - paragraph [ref=e580]: Stormwater management facilities shall mean those structures and facilities that are designed for the collection, conveyance, storage, treatment and disposal of stormwater runoff into and through the drainage system. In most cases stormwater management facilities will refer to facilities whose primary purpose is related to the quantity of stormwater while BMPs primary purpose will be related to water quality concerns of stormwater.
                        - paragraph [ref=e581]: (71)
                        - paragraph [ref=e582]: Stormwater runoff shall mean the direct response of a watershed to precipitation and includes the surface and subsurface runoff that enters a ditch, stream, storm drain or other concentrated flow during and following the precipitation.
                        - paragraph [ref=e583]: (72)
                        - paragraph [ref=e584]: "Subdivision shall mean all divisions of a tract or parcel of land into two (2) or more lots, building sites, or other divisions for the purpose, whether immediate or future, of sale, lease, or building development, and includes all divisions of land involving a new street or change in existing streets, and includes re-subdivision which would involve the further division or relocation of lot lines of any lot or lots within a subdivision previously made and approved or recorded according to law; or, the alteration of any streets or the establishment of any new streets within any subdivision previously made and approved or recorded according to law, and includes combinations of lots of record; however, the following exceptions are included within this definition only for the purpose of requiring that the local planning agency be informed and have a record of the subdivision:"
                        - paragraph [ref=e585]: a.
                        - paragraph [ref=e586]: The combination or recombination of portions of previously platted lots where the total number of lots is not increased and the resultant lots are equal to the standards of the city;
                        - paragraph [ref=e587]: b.
                        - paragraph [ref=e588]: The division of land into parcels of five (5) acres or more where no new street is involved and plats of these exceptions must be received as information by the planning agency which shall indicate that fact on the plats; and
                        - paragraph [ref=e589]: c.
                        - paragraph [ref=e590]: The combination or recombination of entire lots of record where no new street or change in existing streets is involved.
                        - paragraph [ref=e591]: (73)
                        - paragraph [ref=e592]: Swale shall mean a structural measure with a lining of grass, riprap or other materials, which can function as a detention structure or BMP and convey stormwater runoff without causing erosion.
                        - paragraph [ref=e593]: (74)
                        - paragraph [ref=e594]: 10-percent point is the location in the drainage system downstream from the proposed development, where the proposed development represents less than 10 percent of the total watershed draining to this location.
                        - paragraph [ref=e595]: (75)
                        - paragraph [ref=e596]: 10-year frequency storm shall mean a storm that is capable of producing rainfall expected to be equaled or exceeded on the average of once in 10 years. It may also be expressed as an exceedance probability with a 10 percent chance of being equaled or exceeded in any given year.
                        - paragraph [ref=e597]: (76)
                        - paragraph [ref=e598]: 25-year frequency storm shall mean a storm that is capable of producing rainfall expected to be equaled or exceeded on the average of once in 25 years. It may also be expressed as an exceedance probability with a four (4) percent chance of being equaled or exceeded in any given year.
                        - paragraph [ref=e599]: (77)
                        - paragraph [ref=e600]: Variance shall mean the modification of the minimum stormwater management requirements for specific circumstances where strict adherence of the requirements would result in unnecessary hardship and not fulfill the intent of this chapter.
                        - paragraph [ref=e601]: (78)
                        - paragraph [ref=e602]: Waiver shall mean the relinquishment from stormwater management requirements by the city public works director or his duly appointed designee for a specific land disturbing activity on a case-by-case review basis, based on detailed engineering analysis submitted by the owner or his representative.
                        - paragraph [ref=e603]: (79)
                        - paragraph [ref=e604]: Water quality shall mean those characteristics of stormwater runoff from a land disturbing activity that relate to the physical, chemical, biological, or radiological integrity of water.
                        - paragraph [ref=e605]: (80)
                        - paragraph [ref=e606]: Water quantity shall mean those characteristics of stormwater runoff that relate to the rate and volume of the stormwater runoff within the development and to downstream areas resulting from land disturbing activities.
                        - paragraph [ref=e607]: (81)
                        - paragraph [ref=e608]: Watershed shall mean the drainage area contributing stormwater runoff to a single point.
                        - paragraph [ref=e609]: (82)
                        - paragraph [ref=e610]: Wetland shall mean those areas that are inundated or saturated by surface or groundwater at a frequency and duration sufficient to support, and that under normal circumstances do support, a prevalence of vegetation typically adapted for life in saturated soil conditions. Wetlands include swamps, marshes, bogs, and similar areas as determined by the Army Corps of Engineers.
                        - paragraph [ref=e611]: (Ord. No. 2015-05-04(D), 5/4/15)
