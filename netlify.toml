[build]
  command = "npm run build"
  publish = "dist"

# Netlify applies every matching rule and the last match wins, so the catch-all comes first.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/timeless-contact.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
