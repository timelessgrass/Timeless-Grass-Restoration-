                      - generic [ref=e1877]:
                        - paragraph [ref=e1878]: (a)
                        - paragraph [ref=e1879]: The zoning board of appeals may grant a variance from the requirements of this chapter if there are exceptional circumstances applicable to the site such that strict adherence to the provisions of the ordinance codified in this chapter will result in unnecessary hardship and not fulfill the intent of the ordinance.
                        - paragraph [ref=e1880]: (b)
                        - paragraph [ref=e1881]: A written request for a variance shall be required and shall state the specific variance sought and the reasons, with supporting data, for their granting. The request shall include descriptions, drawings, calculations and any other information that is necessary to evaluate the proposed variance.
                        - paragraph [ref=e1882]: (c)
                        - paragraph [ref=e1883]: Any substantial variance from the stormwater management and sediment control plan or master plan shall be referred to all agencies, which reviewed the original plan.
                        - paragraph [ref=e1884]: (d)
                        - paragraph [ref=e1885]: The city public works director or his duly appointed designee will conduct a review of the request for a variance and submit a report to the zoning board of appeals.
                        - paragraph [ref=e1886]: (e)
                        - paragraph [ref=e1887]: "The zoning board of appeals may grant a variance from the requirements of this chapter if the proposed development activity will not:"
                        - paragraph [ref=e1888]: (1)
                        - paragraph [ref=e1889]: Change the rate or volume of runoff significantly;
                        - paragraph [ref=e1890]: (2)
                        - paragraph [ref=e1891]: Have a significant, negative impact on wetland, watercourse, or water body; or
                        - paragraph [ref=e1892]: (3)
                        - paragraph [ref=e1893]: Contribute to degradation of water quality.
                        - paragraph [ref=e1894]: (Ord. No. 2015-05-04(D), 5/4/15)
