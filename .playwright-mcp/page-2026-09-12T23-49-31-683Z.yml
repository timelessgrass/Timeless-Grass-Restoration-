                        - paragraph [ref=e1374]: Stormwater master and stormwater management and sediment control plans and design reports that are incidental to the overall or ongoing site design shall be prepared, and stamped/sealed by a qualified registered professional engineer, Tier 2B land surveyor or landscape architect, using acceptable engineering standards and practices. All other stormwater master and stormwater management and sediment control plans and design reports shall be prepared, and stamped/sealed by a qualified registered professional engineer, using acceptable engineering standards and practices.
                        - paragraph [ref=e1375]: The engineer, surveyor, or landscape architect shall perform services only in areas of his competence, and shall undertake to perform engineering or land surveying assignments only when qualified by education and/or experience in the specific technical field. In addition, the engineer, surveyor, or landscape architect must verify that the plans have been designed in accordance with this chapter and the standards and criteria stated or referred to in this chapter.
                        - paragraph [ref=e1376]: (Ord. No. 2015-05-04(D), 5/4/15)
