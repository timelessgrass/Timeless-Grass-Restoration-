                      - generic [ref=e355]:
                        - paragraph [ref=e356]: (a)
                        - paragraph [ref=e357]: "Title. The provisions of this chapter shall constitute and be known as Ordinance #2015-05-04 (C) the \"Stormwater Management and Sediment Control Ordinance for the City of Conway, South Carolina,\" pursuant to the \"Federal Water Pollution Control Act\" (33 U.S.C. 1251 et seq.) the \"Stormwater Management and Sediment Reduction Act,\" (48-14-10 et seq., South Carolina Code of Laws), South Carolina NPDES General Permit SCR100000 (Stormwater Discharges from Large and Small Construction Activities), and South Carolina NPDES General Permit SCR030000 (Stormwater Discharges from Regulated Small Municipal Separate Storm Sewer Systems (SMS4s))."
                        - paragraph [ref=e358]: (b)
                        - paragraph [ref=e359]: Purpose. The purpose of this chapter is to ensure that the city's waters support their traditional, beneficial uses such as fishing, swimming, outdoor recreation, and drinking by establishing minimum requirements and procedures to maintain the predevelopment runoff characteristics during and after development and to limit the adverse impacts of stream channel erosion, pollution, sedimentation, and flooding. In order to achieve this purpose, the city acknowledges that a comprehensive, watershed-based approach to implementing this chapter is the most effective way to prevent additional water quality and quantity problems and to improve existing problems. Furthermore, the city recognizes the need to design and construct stormwater control systems that serve multiple purposes, including, but not limited to, flood prevention, water quality protection, wildlife habitat preservation, education, recreation and wetlands protection.
                        - paragraph [ref=e360]: (c)
                        - paragraph [ref=e361]: "Objectives. The objectives of this chapter include the following:"
                        - paragraph [ref=e362]: (1)
                        - paragraph [ref=e363]: "Comply with state and federal (EPA) stormwater regulations developed pursuant to the Federal Clean Water Act:"
                        - paragraph [ref=e364]: a.
                        - paragraph [ref=e365]: Assist in the attainment and maintenance of water quality standards by removing waters from South Carolina's 303(d) listing of impaired waters and preventing waters from joining the list;
                        - paragraph [ref=e366]: b.
                        - paragraph [ref=e367]: Control pollution and manage the quality and quantity of stormwater associated with land disturbing activities by requiring approval and implementation of stormwater management and sediment control plans;
                        - paragraph [ref=e368]: c.
                        - paragraph [ref=e369]: Prohibit illicit connections to the stormwater drainage system;
                        - paragraph [ref=e370]: d.
                        - paragraph [ref=e371]: Control discharges to the stormwater drainage system from spills and dumping or disposal of materials other than stormwater; and
                        - paragraph [ref=e372]: e.
                        - paragraph [ref=e373]: Control, through intergovernmental agreements, contribution of pollutants from one (1) municipal separate storm sewer system (MS4) to another.
                        - paragraph [ref=e374]: (2)
                        - paragraph [ref=e375]: Protect, preserve, and enhance water quality and fish and wildlife habitat within the city and in downstream receiving waters.
                        - paragraph [ref=e376]: (3)
                        - paragraph [ref=e377]: "Plan for and manage stormwater beyond individual subdivisions or developments as follows:"
                        - paragraph [ref=e378]: a.
                        - paragraph [ref=e379]: Develop basin management plans to improve waters with known or suspected water quality and/or quantity problems, as prioritized and delineated by the city (see guidance in Appendix A as incorporated by reference only);
                        - paragraph [ref=e380]: b.
                        - paragraph [ref=e381]: Reduce the effects of development on land and stream channel erosion and reduce long-term expenses and remedial projects caused by uncontrolled stormwater runoff and soil erosion;
                        - paragraph [ref=e382]: c.
                        - paragraph [ref=e383]: Reduce local flooding and minimize damage to public and private property;
                        - paragraph [ref=e384]: d.
                        - paragraph [ref=e385]: Maintain a functional drainage system and eliminate the need for costly maintenance and repairs to roads, embankments, ditches, streams, lakes, wetlands, and stormwater control facilities which are the result of inadequate soil erosion and stormwater runoff control;
                        - paragraph [ref=e386]: e.
                        - paragraph [ref=e387]: Assure that soil erosion control and stormwater runoff control systems are incorporated at an early stage into the site planning and design process;
                        - paragraph [ref=e388]: f.
                        - paragraph [ref=e389]: Preserve natural infiltration and the recharge of groundwater and to maintain subsurface flows which replenish lakes, streams and wetlands;
                        - paragraph [ref=e390]: g.
                        - paragraph [ref=e391]: Utilize cost-effective stormwater management methods such as stream and wetland buffers and urban forestry; and
                        - paragraph [ref=e392]: h.
                        - paragraph [ref=e393]: Facilitate sustainable economic development within the city and its surroundings.
                        - paragraph [ref=e394]: (4)
                        - paragraph [ref=e395]: Provide for enforcement of this chapter and penalties for violations.
                        - paragraph [ref=e396]: (d)
                        - paragraph [ref=e397]:
                          - text: Application. This chapter shall apply to any person, unless otherwise exempted in Article I,
                          - link "section 3-6-5" [ref=e398] [cursor=pointer]:
                            - /url: https://library.municode.com/sc/conway/codes/code_of_ordinances?nodeId=TIT3PUWO_CH6STMASECO_ARTIGEPR_S3-6-5EXRE
                          - text: ", who undertakes a land disturbing activity. The application of this chapter and the provisions expressed herein shall be the minimum stormwater management requirements, which include an approved stormwater management and sediment control plan. In addition, all plans must be reviewed by the city engineer to ensure that established water quality standards will be maintained during and after development of the site and that post-construction runoff levels are consistent with any local and regional watershed plans. It is the designer's responsibility to comply with these requirements."
                        - paragraph [ref=e399]: (Ord. No. 2015-05-04(D), 5/4/15)
                  - listitem [ref=e400]:
