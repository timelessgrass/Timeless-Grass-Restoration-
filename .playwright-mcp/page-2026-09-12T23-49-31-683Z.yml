                      - generic [ref=e723]:
                        - paragraph [ref=e724]: The following land disturbing activities are exempt from the provisions of this chapter and the requirements of providing stormwater management measures when it is determined by the city public works director or his duly appointed designee that no adverse impact is created. Even if exempt from this chapter, land disturbing activity is not allowed to divert water to adjacent property or waterways to cause a nuisance and/or property damage, cause pollution or sedimentation, or any adverse impact.
                        - paragraph [ref=e725]: (a)
                        - paragraph [ref=e726]: Construction or improvement of a single-family residence (single-family residence - separately built) or their accessory buildings, or mobile home, that is separately built and not part of multiple construction or a subdivision development approved under this chapter. If included in a subdivision plan, all land disturbing activities must follow the stormwater management and sediment control plan that has been approved for the subdivision;
                        - paragraph [ref=e727]: (b)
                        - paragraph [ref=e728]: Land disturbing activities that disturb less than one-half (½) acre of land area;
                        - paragraph [ref=e729]: (c)
                        - paragraph [ref=e730]: Any maintenance or renovation of an existing structure or system not materially changing or affecting the rate, concentration or volume of stormwater runoff;
                        - paragraph [ref=e731]: (d)
                        - paragraph [ref=e732]: Land disturbing activities for agricultural uses, provided that the activities operate using an approved nutrient management plan;
                        - paragraph [ref=e733]: (e)
                        - paragraph [ref=e734]: Land disturbing activities undertaken on forest land for the production and harvesting of timber and timber products, provided that the activities operate using best management practices according to the South Carolina Forestry Commission.
                        - paragraph [ref=e735]: Note that a change in land use from agricultural or forestry land uses shall result in a loss of exemption from the provisions of this chapter and the requirements of providing stormwater management measures.
                        - paragraph [ref=e736]: (Ord. No. 2015-05-04(D), 5/4/15)
