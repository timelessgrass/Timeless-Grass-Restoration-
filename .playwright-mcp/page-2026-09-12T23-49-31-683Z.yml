                        - paragraph [ref=e1335]: "A stop-work order may be issued if one (1) or more of the following violations have been committed:"
                        - paragraph [ref=e1336]: (a)
                        - paragraph [ref=e1337]: Violation(s) of the conditions of the stormwater management and sediment control plan;
                        - paragraph [ref=e1338]: (b)
                        - paragraph [ref=e1339]: Construction not in accordance with the intent of the approved plans;
                        - paragraph [ref=e1340]: (c)
                        - paragraph [ref=e1341]: Approval of a stormwater management and sediment control plan has not been obtained;
                        - paragraph [ref=e1342]: (d)
                        - paragraph [ref=e1343]: Noncompliance with correction notice(s); or
                        - paragraph [ref=e1344]: (e)
                        - paragraph [ref=e1345]: The existence of an immediate danger in a downstream area in the judgment of the city public works director or his duly appointed designee, inspector or building inspector.
                        - paragraph [ref=e1346]: If one (1) or more of these conditions are found, a written notice of violation shall be served upon the owner or authorized representative and the time in which to correct the deficiencies shall be specified. The notice shall set forth the measures necessary to achieve compliance with the plan. Correction of these violations must be started immediately or the owner shall be deemed in violation of this chapter.
                        - paragraph [ref=e1347]: If appropriate remedial actions as outlined in the written notice are not completed within the specified time period, a stop-work order will be issued within seven (7) days. The stop-work order will then be in force until the development is in compliance with this chapter.
                        - paragraph [ref=e1348]: If a violation of this chapter is occurring that the city public works director or his duly appointed designee, inspector, or building inspector determines in his judgment will cause significant damage to downstream property or structures, the city public works director or his duly appointed designee, inspector, or building inspector can issue an immediate stop-work order.
                        - paragraph [ref=e1349]: (Ord. No. 2015-05-04(D), 5/4/15)
