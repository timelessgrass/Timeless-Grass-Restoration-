                        - paragraph [ref=e674]: (a)
                        - paragraph [ref=e675]:
                          - text: The city shall have the authority to administer and enforce all regulations and procedures adopted to implement this chapter, including the right to issue stop-work orders and maintain an action or procedure in any court of competent jurisdiction to compel compliance with or restrain any violation of this chapter, and to issue summons pursuant to the provisions of
                          - link "section 1-3-48" [ref=e676] [cursor=pointer]:
                            - /url: https://library.municode.com/sc/conway/codes/code_of_ordinances?nodeId=TIT1GOAD_CH3RUPROR_ARTCUSCO_S1-3-48GEPECOVI
                          - text: of Article C, Code of Ordinance for the City of Conway, South Carolina; Code 1978 section 1-30-48, as amended by Ord. No. 87-9-28(G), 9/28/87; Ord. 92-12-14(A), 12/14/92; Ord. No. 93-9-27(B), 9/27/93, which shall be amended to include reference to the authority of the city public works director or his duly appointed designee to issue summons in this regard.
                        - paragraph [ref=e677]: (b)
                        - paragraph [ref=e678]: "The city shall:"
                        - paragraph [ref=e679]: (1)
                        - paragraph [ref=e680]: Administer, coordinate and oversee, design, construction, and operation and maintenance of city stormwater facilities and conveyances;
                        - paragraph [ref=e681]: (2)
                        - paragraph [ref=e682]: Establish or oversee establishment of development standards and guidelines;
                        - paragraph [ref=e683]: (3)
                        - paragraph [ref=e684]: Determine the manner in which stormwater facilities should be operated;
                        - paragraph [ref=e685]: (4)
                        - paragraph [ref=e686]: Inspect private systems which discharge to a public drainage system;
                        - paragraph [ref=e687]: (5)
                        - paragraph [ref=e688]: Have right of entry to any private properties where there is a suspected illicit discharge;
                        - paragraph [ref=e689]: (6)
                        - paragraph [ref=e690]: Require compliance with maintenance requirements;
                        - paragraph [ref=e691]: (7)
                        - paragraph [ref=e692]: Protect facilities and properties controlled by the city and prescribe how they are used by others;
                        - paragraph [ref=e693]: (8)
                        - paragraph [ref=e694]: Require proposed developments, not exempt from this chapter, to comply with the terms of this chapter;
                        - paragraph [ref=e695]: (9)
                        - paragraph [ref=e696]: Develop programs or procedures to control the discharge of pollutants into the public drainage system; and
                        - paragraph [ref=e697]: (10)
                        - paragraph [ref=e698]: Implement the stormwater management program for the City of Conway, South Carolina.
                        - paragraph [ref=e699]: (Ord. No. 2015-05-04(D), 5/4/15)
