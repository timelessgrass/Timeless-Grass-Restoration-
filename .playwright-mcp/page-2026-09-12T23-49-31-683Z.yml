                      - generic [ref=e1538]:
                        - paragraph [ref=e1539]: (a)
                        - paragraph [ref=e1540]: Prior to the approval of the stormwater management and sediment control plan, the owner shall submit a proposed staged construction and inspection control schedule. This plan shall indicate a phase line for approval; otherwise the construction and inspection control schedule will be for the entire drainage system.
                        - paragraph [ref=e1541]: (b)
                        - paragraph [ref=e1542]: The owner shall notify the city public works director or his duly appointed designee before commencing any work to implement the stormwater management and sediment control plan and upon completion of the work.
                        - paragraph [ref=e1543]: (c)
                        - paragraph [ref=e1544]: "Inspections shall be conducted by the owner at least once every calendar week. Inspection reports (see example at http://www.scdhec.gov/environment/WaterQuality/Stormwater/ApplicationsForms/, incorporated by reference only) shall be completed and, at a minimum, include the following information:"
                        - paragraph [ref=e1545]: (1)
                        - paragraph [ref=e1546]: The inspection date;
                        - paragraph [ref=e1547]: (2)
                        - paragraph [ref=e1548]: Names, titles, and qualifications of personnel making the inspection;
                        - paragraph [ref=e1549]: (3)
                        - paragraph [ref=e1550]: Weather information and a description of any discharges occurring at the time of the inspection;
                        - paragraph [ref=e1551]: (4)
                        - paragraph [ref=e1552]: Location(s) of discharge of sediment or other pollutants from the site;
                        - paragraph [ref=e1553]: (5)
                        - paragraph [ref=e1554]: Location(s) of stormwater management facilities that need maintenance;
                        - paragraph [ref=e1555]: (6)
                        - paragraph [ref=e1556]: Location(s) of stormwater management facilities that failed to operate as designed or proved inadequate for a particular location;
                        - paragraph [ref=e1557]: (7)
                        - paragraph [ref=e1558]: Location(s) where additional stormwater management facilities are needed that did not exist at the time of inspection; and
                        - paragraph [ref=e1559]: (8)
                        - paragraph [ref=e1560]: Corrective action required including any changes to the stormwater management and sediment control plan necessary and implementation dates.
                        - paragraph [ref=e1561]: (d)
                        - paragraph [ref=e1562]: "For construction sites disturbing 10 acres or more, inspection reports shall be summarized monthly and, at a minimum, shall include the following information:"
                        - paragraph [ref=e1563]: (1)
                        - paragraph [ref=e1564]: A summary of the inspection results conducted during the month;
                        - paragraph [ref=e1565]: (2)
                        - paragraph [ref=e1566]: A listing of all deficiencies noted with the date the deficiency was noted;
                        - paragraph [ref=e1567]: (3)
                        - paragraph [ref=e1568]: For each deficiency noted that required corrective action, a listing of the name(s), address(es), and telephone number(s) of the party or parties responsible and a statement whether this deficiency was previously listed in a monthly report;
                        - paragraph [ref=e1569]: (4)
                        - paragraph [ref=e1570]: A listing of the corrective actions that were taken to remedy any deficiencies noted and the date the corrective actions were completed;
                        - paragraph [ref=e1571]: (5)
                        - paragraph [ref=e1572]: A statement on whether or not the stormwater management and sediment control plan was updated to deal with any deficiencies noted; and
                        - paragraph [ref=e1573]: (6)
                        - paragraph [ref=e1574]: A copy of each inspection conducted during the month.
                        - paragraph [ref=e1575]: (e)
                        - paragraph [ref=e1576]: "The city public works director or his duly appointed designee shall maintain a file of inspection reports and provide copies of all inspection reports to the owner that include the following:"
                        - paragraph [ref=e1577]: (1)
                        - paragraph [ref=e1578]: The date and location of the site inspection;
                        - paragraph [ref=e1579]: (2)
                        - paragraph [ref=e1580]: Whether the approved plan has been properly implemented;
                        - paragraph [ref=e1581]: (3)
                        - paragraph [ref=e1582]: Any approved plan deficiencies and any actions taken.
                        - paragraph [ref=e1583]: (f)
                        - paragraph [ref=e1584]: Any portion of the work, which does not comply with the stormwater management and sediment control plan, shall be promptly corrected by the owner.
                        - paragraph [ref=e1585]: (g)
                        - paragraph [ref=e1586]: "The city public works director or his duly appointed designee will notify the person responsible for the land disturbing activity in writing when violations are observed describing the following:"
                        - paragraph [ref=e1587]: (1)
                        - paragraph [ref=e1588]: Nature of the violation;
                        - paragraph [ref=e1589]: (2)
                        - paragraph [ref=e1590]: Required corrective actions;
                        - paragraph [ref=e1591]: (3)
                        - paragraph [ref=e1592]: The time period for violation correction.
                        - paragraph [ref=e1593]: (h)
                        - paragraph [ref=e1594]: A final inspection shall be conducted by the city public works director or his duly appointed designee upon completion of the work included in the approved stormwater management and sediment control plan to ensure compliance with the plan.
                        - paragraph [ref=e1595]: (i)
                        - paragraph [ref=e1596]:
                          - text: The owner shall provide an "as-built" plan signed and sealed by a registered professional (as outlined in Article II,
                          - link "section 3-6-18" [ref=e1597] [cursor=pointer]:
                            - /url: https://library.municode.com/sc/conway/codes/code_of_ordinances?nodeId=TIT3PUWO_CH6STMASECO_ARTIIAPPRSTMASTMASECOPL_S3-6-18PRRERE
                          - text: ") to be submitted upon completion of the stormwater management facilities included in the stormwater management and sediment control plan. The registered professional shall state that:"
                        - paragraph [ref=e1598]: (1)
                        - paragraph [ref=e1599]: The facilities have been constructed as shown on the "as-built" plan; and
                        - paragraph [ref=e1600]: (2)
                        - paragraph [ref=e1601]: The facilities meet the approved stormwater management and sediment control plan and specifications or achieve the function for which they were designed.
                        - paragraph [ref=e1602]: (j)
                        - paragraph [ref=e1603]: No stage work, related to the construction of stormwater management facilities and BMPs, shall proceed until the next preceding stage of work, according to the sequence specified in the approved staged construction and inspection control schedule, is inspected and approved.
                        - paragraph [ref=e1604]: (Ord. No. 2015-05-04(D), 5/4/15)
