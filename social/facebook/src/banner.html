<!doctype html>
<meta charset="utf-8">
<title>Cover 1640x624</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=block">
<link rel="stylesheet" href="brand.css">
<style>
  /* Facebook shows 820x312 on desktop (crops ~24px top and bottom) and crops ~90px off each side on phones.
     The profile picture covers the bottom-left corner, so the copy sits on the right inside the safe zone.
     The photo panel is 1180px wide, narrower than the 1400px source, so the photo is never upscaled. */
  .cover{position:relative;width:1640px;height:624px;overflow:hidden;background:var(--dark)}
  .cover .photo{right:auto;width:1180px;background-image:url(../../../public/assets/img/backyard-putting-green-landscaped-boulders.jpg);background-position:50% 72%}
  .cover .veil{background:linear-gradient(90deg,rgba(12,24,9,0) 0px,rgba(12,24,9,0) 720px,rgba(12,24,9,.86) 990px,var(--dark) 1150px,var(--dark) 1640px)}
  .copy{position:absolute;left:1020px;width:440px;top:50%;transform:translateY(-50%)}
  .kicker{font-size:20px}
  h1{margin-top:18px;font-size:46px;line-height:1.06;font-weight:800;letter-spacing:-.025em}
  .tag{margin-top:24px;font-size:28px;font-weight:800;letter-spacing:-.01em}
  .area{margin-top:8px;font-size:21px;font-weight:600;color:#b9c8b0}
</style>
<div class="cover">
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="copy">
    <p class="kicker">Grand Strand</p>
    <h1>Artificial turf cleaning &amp; <span class="gold">putting green restoration</span></h1>
    <p class="tag">Blown clean, every job.</p>
    <p class="area">Shallotte, NC to Burgess, SC</p>
  </div>
</div>
