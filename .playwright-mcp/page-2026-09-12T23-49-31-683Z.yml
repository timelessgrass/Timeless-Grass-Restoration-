                              - generic [ref=e1218]: 
                              - generic [ref=e1219]: Email section
                      - generic [ref=e1221]:
                        - paragraph [ref=e1222]: The sediment control portion of the stormwater management and sediment control plan shall provide effective measures to control erosion and sedimentation. Proper design shall include measures for erosion control and provide for the establishment of vegetation that will help avoid erosion problems during and after land disturbing activities. Alignment, grades, area of disturbed soil and bank slopes shall be based on soil erodibility, climatic exposure, geology, proposed vegetative restoration and expected maintenance.
                        - paragraph [ref=e1223]: "Following are some general guidelines that shall be followed:"
                        - paragraph [ref=e1224]: (a)
                        - paragraph [ref=e1225]: Provide sediment control facilities designed using the standards in the South Carolina Stormwater Management BMP Handbook, as amended from time to time;
                        - paragraph [ref=e1226]: (b)
                        - paragraph [ref=e1227]: For sediment basins and other BMPs for sediment control, the design must meet a removal efficiency of 80 percent suspended solids from a 10-year, 24-hour design storm;
                        - paragraph [ref=e1228]: (c)
                        - paragraph [ref=e1229]: Existing vegetation shall be preserved whenever possible to control erosion. Slopes and any area of land from which natural vegetative cover has been partially or wholly removed shall be re-vegetated, preferably with native vegetation, within 10 days from the substantial completion of clearing and construction;
                        - paragraph [ref=e1230]: (d)
                        - paragraph [ref=e1231]: Drainage channels should be designed to avoid erosion problems. Wide channels with flat slopes lined with grass or other vegetation should be used where practical. Where channel gradients are 10 percent or greater, concrete linings or grade control structures such as check dams may be required. Every effort should be made to preserve natural channels;
                        - paragraph [ref=e1232]: (e)
                        - paragraph [ref=e1233]: Sediment basins may be constructed to trap sediment. The basins should be constructed with a positive outfall to discharge stormwater runoff while retaining sediment loads. Sediment basins may be temporary or permanent as required by the city public works director or his duly appointed designee;
                        - paragraph [ref=e1234]: (f)
                        - paragraph [ref=e1235]: Detention basins may also be used to trap sediment during and after development. Where used for this purpose, the basin shall be designed in accordance with the hydraulic design criteria, and include a sediment forebay and dewatering device. Added storage volume for stormwater shall be required to account for the volume lost to sedimentation. A plan shall be submitted for conversion of the detention basin to a permanent stormwater control structure, including sediment clean-out, re-vegetation, and a schedule. Sediment must be removed periodically to insure the intended performance of the basin. A clean-out elevation or maximum sediment storage volume shall be calculated for the basin and a marker installed in the basin to indicate when sediment must be removed to provide required storage for stormwater discharge control;
                        - paragraph [ref=e1236]: (g)
                        - paragraph [ref=e1237]: Silt fencing, sediment tubes or other methods approved by the city shall be placed around storm sewer inlets and at the boundaries of disturbed areas to trap sediment and prevent sediment from reaching wetlands, streams or drainage systems;
                        - paragraph [ref=e1238]: (h)
                        - paragraph [ref=e1239]: All construction entrance/egress must be stabilized to minimize deposition of sediment onto adjacent roadways.
                        - paragraph [ref=e1240]: (i)
                        - paragraph [ref=e1241]: "Contents of the sediment control portion of the stormwater management and sediment control plan shall include as a minimum the following items:"
                        - paragraph [ref=e1242]: (1)
                        - paragraph [ref=e1243]: Location, scope, and manner of performing sediment and erosion control measures,
                        - paragraph [ref=e1244]: (2)
                        - paragraph [ref=e1245]: "Proposed construction sequence and time schedule for all earth disturbing activities and installation of provisions for sediment and erosion control that shall, at a minimum, include the following activities:"
                        - paragraph [ref=e1246]: a.
                        - paragraph [ref=e1247]: Clearing and grubbing for those areas necessary for installation of perimeter control,
                        - paragraph [ref=e1248]: b.
                        - paragraph [ref=e1249]: Installation of sediment basins and traps,
                        - paragraph [ref=e1250]: c.
                        - paragraph [ref=e1251]: Construction or perimeter controls,
                        - paragraph [ref=e1252]: d.
                        - paragraph [ref=e1253]: Remaining clearing and grubbing,
                        - paragraph [ref=e1254]: e.
                        - paragraph [ref=e1255]: Road grading,
                        - paragraph [ref=e1256]: f.
                        - paragraph [ref=e1257]: Grading for the remainder of the site,
                        - paragraph [ref=e1258]: g.
                        - paragraph [ref=e1259]: Utility installation and whether storm drains will be used or blocked until after completion of construction,
                        - paragraph [ref=e1260]: h.
                        - paragraph [ref=e1261]: Final grading, landscaping, or stabilization, and
                        - paragraph [ref=e1262]: i.
                        - paragraph [ref=e1263]: Removal of sediment controls,
                        - paragraph [ref=e1264]: (3)
                        - paragraph [ref=e1265]: Design computations and applicable assumptions for all structural measures for sediment and erosion control. Volume and velocity must be given for all surface water conveyance measures and piped outfalls.
                        - paragraph [ref=e1266]: (Ord. No. 2015-05-04(D), 5/4/15)
