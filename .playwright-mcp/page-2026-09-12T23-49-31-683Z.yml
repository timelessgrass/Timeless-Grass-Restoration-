                      - generic [ref=e1119]:
                        - paragraph [ref=e1120]: (a)
                        - paragraph [ref=e1121]: "The minimum stormwater quantity control requirements shall provide management measures necessary to accomplish the following:"
                        - paragraph [ref=e1122]: (1)
                        - paragraph [ref=e1123]: Install stormwater management facilities to limit the 10-year and 25-year developed peak discharge rates to predevelopment peak discharge rates. The design of these facilities shall be based on procedures contained in the Stormwater Design Manuals or approved by the city public works director or his duly appointed designee that meet the intent of this chapter;
                        - paragraph [ref=e1124]: (2)
                        - paragraph [ref=e1125]: "The requirements, or portions thereof, of subsection (a)(1) may be waived by the city public works director or his duly appointed designee if it can be shown by detailed engineering calculations and analysis supplied by the owner which are acceptable to the city public works director or his duly appointed designee that one (1) of the following exists:"
                        - paragraph [ref=e1126]: a.
                        - paragraph [ref=e1127]: The installation of stormwater management facilities would have no adverse impact on downstream flood peaks,
                        - paragraph [ref=e1128]: b.
                        - paragraph [ref=e1129]: Stormwater management facilities are not needed to protect downstream developments and the downstream drainage system has, or can and will be made to have, sufficient capacity to receive any increase in runoff for the design storm, or
                        - paragraph [ref=e1130]: c.
                        - paragraph [ref=e1131]: The city public works director or his duly appointed designee determines that stormwater management facilities are not needed to control developed peak discharge rates and installing such facilities would not be in the best interest of the city;
                        - paragraph [ref=e1132]: (3)
                        - paragraph [ref=e1133]: The requirements, or portions thereof, of subsection (a)(1) may not be waived if the city public works director or his duly appointed designee determines that not providing peak flood controls would increase known flooding problems, or exceed the capacity of the downstream drainage system;
                        - paragraph [ref=e1134]: (4)
                        - paragraph [ref=e1135]: A waiver of these minimum runoff quantity control requirements shall only be granted after a written request is submitted by the owner containing descriptions, drawings, and any other information that is necessary to evaluate the proposed land disturbing activity. A separate written waiver request shall be required if there are subsequent additions, extensions, or modifications, to the development which would alter the approved stormwater runoff characteristics to a land disturbing activity receiving a waiver.
                        - paragraph [ref=e1136]: (b)
                        - paragraph [ref=e1137]: Stormwater management facilities may include both structural and nonstructural elements. Natural swales and other natural runoff conduits shall be retained where practicable.
                        - paragraph [ref=e1138]: (c)
                        - paragraph [ref=e1139]: "Where additional stormwater management facilities are required to satisfy the minimum control requirements, the following measures are examples of what may be used:"
                        - paragraph [ref=e1140]: (1)
                        - paragraph [ref=e1141]: Stormwater detention structures;
                        - paragraph [ref=e1142]: (2)
                        - paragraph [ref=e1143]: Stormwater retention structures;
                        - paragraph [ref=e1144]: (3)
                        - paragraph [ref=e1145]: Facilities designed to encourage overland flow, slow velocities of flow, and flow through vegetated facilities and buffer zones; and
                        - paragraph [ref=e1146]: (4)
                        - paragraph [ref=e1147]: Infiltration and filtration practices.
                        - paragraph [ref=e1148]: (d)
                        - paragraph [ref=e1149]: Where detention and retention structures are used, designs, which consolidate these facilities into a limited number of large structures, will be preferred over designs that utilize a large number of small structures. In addition, designs that utilize weirs to control the discharge for the 10-year and 25-year storms are preferred to multiple pipes used for outlet control.
                        - paragraph [ref=e1150]: (e)
                        - paragraph [ref=e1151]: Discharge velocities shall be reduced to provide a nonerosive velocity flow from a structure, channel, or other control measure as outlined in the Stormwater Design Manual.
                        - paragraph [ref=e1152]: (f)
                        - paragraph [ref=e1153]: Stormwater management and sediment control plans can be rejected by the city public works director or his duly appointed designee if they incorporate structures and facilities that will demand considerable maintenance, will be difficult to maintain, or utilized numerous small structures if other alternatives are physically possible.
                        - paragraph [ref=e1154]: (g)
                        - paragraph [ref=e1155]: The drainage system and all stormwater management structures within the city (including both public and private portions) will be designed to the same engineering and technical criteria and standards. The city's review will be the same whether the portion of the drainage system will be under public or private control or ownership.
                        - paragraph [ref=e1156]: (h)
                        - paragraph [ref=e1157]: All stormwater management measures shall be designed in accordance with the design criteria and procedures contained in the Stormwater Design Manuals or procedures approved by the city public works director or his duly appointed designee that meet the intent of this chapter.
                        - paragraph [ref=e1158]: (i)
                        - paragraph [ref=e1159]: Detention facilities, detention swales, infiltration systems, and similar stormwater quantity management facilities should be located in right-of-way or common areas rather than on individually owned lots in residential areas.
                        - paragraph [ref=e1160]: (Ord. No. 2015-05-04(D), 5/4/15)
