                      - generic [ref=e1021]:
                        - paragraph [ref=e1022]: "The hydrologic criteria to be used for the stormwater master and stormwater management and sediment control plans shall be as follows:"
                        - paragraph [ref=e1023]: (a)
                        - paragraph [ref=e1024]: Twenty-five-year design storm for all culverts, open channels (including streams, creeks, etc.), stormwater conveyance systems and drainage designs. Culverts and other stormwater conveyance systems under arterial roads shall be designed using the 50-year design storm;
                        - paragraph [ref=e1025]: (b)
                        - paragraph [ref=e1026]: Two-year, 10-year and 25-year design storms for all detention and retention storage facilities using procedures contained in the Stormwater Design Manual or approved by the city Public Works Director or his duly appointed designee;
                        - paragraph [ref=e1027]: (c)
                        - paragraph [ref=e1028]: All drainage designs shall be checked using the 100-year storm, plus one (1) foot, for analysis of local flooding and possible flood hazards to adjacent structures and/or property;
                        - paragraph [ref=e1029]: (d)
                        - paragraph [ref=e1030]: All hydrologic analysis will be based on predevelopment conditions;
                        - paragraph [ref=e1031]: (e)
                        - paragraph [ref=e1032]: For the design of storage facilities, a secondary outlet device or emergency spillway shall be provided to discharge the excess runoff in such a way that no danger of loss or life or facility failure is created. The size of the outlet device or emergency spillway shall be designed to pass the 100-year storm as a minimum requirement;
                        - paragraph [ref=e1033]: (f)
                        - paragraph [ref=e1034]: In determining downstream effects from stormwater management structures, BMPs, and the development, hydrologic-hydraulic engineering studies shall extend downstream to a point where the proposed development represents less than 10 percent of the total watershed. The results of the extended downstream point analysis (10 percent point) shall be included in the hydrologic-hydraulic study submitted with the stormwater management and sediment control plan.
                        - paragraph [ref=e1035]: (Ord. No. 2015-05-04(D), 5/4/15)
                  - listitem [ref=e1036]:
                    - generic [ref=e1039]:
                      - generic [ref=e1040]:
                        - heading "Sec. 3-6-11 - Plan land use conditions criteria." [level=4] [ref=e1042]
                        - generic [ref=e1044]:
                          - text:     
                          - generic [ref=e1045]:
                            - button " Share Link to section" [ref=e1046] [cursor=pointer]:
                              - generic [ref=e1047]: 
                              - generic [ref=e1048]: Share Link to section
                            - button " Print section" [ref=e1049] [cursor=pointer]:
                              - generic [ref=e1050]: 
                              - generic [ref=e1051]: Print section
                            - button " Download (Docx) of sections" [ref=e1052] [cursor=pointer]:
                              - generic [ref=e1053]: 
                              - generic [ref=e1054]: Download (Docx) of sections
                            - button " Email section" [ref=e1055] [cursor=pointer]:
                              - generic [ref=e1056]: 
                              - generic [ref=e1057]: Email section
                      - generic [ref=e1059]:
                        - paragraph [ref=e1060]: For all stormwater management facilities, a hydrologic-hydraulic study shall be done showing how the drainage system will function with and without the proposed facilities. For such studies the following land use conditions shall be used. Existing land use data shall be taken from the 2005 aerial photograph and field checked and updated.
                        - paragraph [ref=e1061]: (a)
                        - paragraph [ref=e1062]: For the design of the facility outlet structure, use developed land use conditions for the area within the proposed development and existing land use conditions for upstream areas draining to the facility.
                        - paragraph [ref=e1063]: (b)
                        - paragraph [ref=e1064]: For any analysis of flood flows downstream from the proposed facility, use existing land use conditions for all downstream areas.
                        - paragraph [ref=e1065]: (c)
                        - paragraph [ref=e1066]: All stormwater management facilities, emergency spillways shall be checked using the 100-year storm and routing flows through the facility and emergency spillways. For this analysis, developed land use conditions shall be used for all areas within the analysis.
                        - paragraph [ref=e1067]: (d)
                        - paragraph [ref=e1068]: The effects of existing upstream detention facilities can be considered in the hydrologic-hydraulic study if these facilities have been accepted for city maintenance.
                        - paragraph [ref=e1069]: (Ord. No. 2015-05-04(D), 5/4/15)
                  - listitem [ref=e1070]:
                    - generic [ref=e1073]:
                      - generic [ref=e1074]:
