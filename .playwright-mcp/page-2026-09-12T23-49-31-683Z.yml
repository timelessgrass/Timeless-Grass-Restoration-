                      - generic [ref=e1829]:
                        - paragraph [ref=e1830]: (a)
                        - paragraph [ref=e1831]: Authority to inspect. Whenever necessary to make an inspection to enforce any provision of this article, or whenever the city public works director or his duly appointed designee has cause to believe that there exists, or potentially exists, in or upon any premises any condition which constitutes a violation of this article, the manager or his designee may enter such premises at all reasonable times to inspect the same and to inspect any copy records related to stormwater compliance. In the event the owner or occupant refuses entry after a request to enter and inspect has been made, the city is hereby empowered to seek assistance from any court of competent jurisdiction in obtaining such entry.
                        - paragraph [ref=e1832]: (b)
                        - paragraph [ref=e1833]: Authority to sample, establish sampling devices and test. During any inspection as provided herein, the city public works director or his duly appointed designee may perform any testing deemed necessary to aid in the pursuit of the inquiry or to record site activities.
                        - paragraph [ref=e1834]: (c)
                        - paragraph [ref=e1835]: "Notice of violation. Whenever the city public works director or his duly appointed designee finds that a person has violated a prohibition or failed to meet a requirement of this article, the city public works director or his duly appointed designee may order compliance by written notice of violation to the responsible person. Such notice may require without limitation:"
                        - paragraph [ref=e1836]: (1)
                        - paragraph [ref=e1837]: The performance of monitoring, analyses, and reporting;
                        - paragraph [ref=e1838]: (2)
                        - paragraph [ref=e1839]: The elimination of illicit connections or discharges;
                        - paragraph [ref=e1840]: (3)
                        - paragraph [ref=e1841]: That violating discharges, practices, or operations shall cease and desist;
                        - paragraph [ref=e1842]: (4)
                        - paragraph [ref=e1843]: The abatement or remediation of stormwater pollution or contamination hazards and the restoration of any affected property;
                        - paragraph [ref=e1844]: (5)
                        - paragraph [ref=e1845]: Payment of a fine to cover administrative and remediation costs; and
                        - paragraph [ref=e1846]: (6)
                        - paragraph [ref=e1847]: The implementation of source control or treatment BMPs.
                        - paragraph [ref=e1848]: If abatement of a violation and/or restoration of affected property is required, the notice shall set forth a deadline within which such remediation or restoration must be completed. Said notice shall further advise that, should the violator fail to remediate or restore within the established deadline, the work will be done by the city or a contractor designated by the city public works director or his duly appointed designee and the expense thereof shall be charged to the violator pursuant to section 31.5-27.
                        - paragraph [ref=e1849]: (d)
                        - paragraph [ref=e1850]: Appeal. Notwithstanding the provisions below, any person receiving a notice of violation may appeal the determination of the city public works director or his duly appointed designee to the city administrator. The notice of appeal must be received by the city administrator within five (5) days from the date of the notice of violation. Hearing on the appeal before the city manager or his designee shall take place within 15 days from the date of city's receipt of the notice of appeal. The decision of the city administrator or designee shall be final.
                        - paragraph [ref=e1851]: (e)
                        - paragraph [ref=e1852]: Abatement by city. If the violation has not been corrected pursuant to the requirements set forth in the notice of violation, or, in the event of an appeal, within 10 days of the decision of the city administrator upholding the decision of the city public works director or his duly appointed designee, the city or a contractor designated by the city public works director or his duly appointed designee shall enter upon the subject private property and is authorized to take any and all measures necessary to abate the violation and/or restore the property. It is unlawful for any person, owner, agent, or person in possession of any premises to refuse to allow the city or designated contractor to enter upon the premises for the purposes set forth above.
                        - paragraph [ref=e1853]: (Ord. No. 2015-05-04(D), 5/4/15)
