                        - paragraph [ref=e1659]: Should the owner fail to properly maintain the drainage system, stormwater management facilities, and BMPs as required by this chapter, the city public works director or his duly appointed designee shall give written notice to the owner of record as appears on the latest property tax rolls, by certified mail, of the nature of the violation and order the corrective action necessary. Should the owner fail, within 30 days from the date of the notice, to take corrective action to the satisfaction of the city public works director or his duly appointed designee or appeal the notice and order, the city may enter upon the lands, take corrective action as the city public works director or his duly appointed designee may deem necessary, and place a lien on the property of the owner for the costs thereof.
                        - paragraph [ref=e1660]: (Ord. No. 2015-05-04(D), 5/4/15)
