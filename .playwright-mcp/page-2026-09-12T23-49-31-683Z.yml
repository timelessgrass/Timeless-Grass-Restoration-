                      - generic [ref=e1093]:
                        - paragraph [ref=e1094]: Wetland areas shall not be disturbed until documentation is provided to the city public works director or his duly appointed designee to show that the owner has received approval from the U.S. Army Corps of Engineers and the South Carolina Department of Health and Environmental Control regarding appropriate permits and approval of development activities. Note that change in land use may result in a change of approval status and additional documentation may be required. Untreated stormwater shall not be discharged into wetlands or receiving waters.
                        - paragraph [ref=e1095]: (Ord. No. 2015-05-04(D), 5/4/15)
                  - listitem [ref=e1096]:
                    - generic [ref=e1099]:
                      - generic [ref=e1100]:
                        - heading "Sec. 3-6-13 - Minimum stormwater quantity control requirements." [level=4] [ref=e1102]
                        - generic [ref=e1104]:
