                      - generic [ref=e1944]:
                        - paragraph [ref=e1945]: (a)
                        - paragraph [ref=e1946]: Any person violating, participating in, assisting in, or maintaining a violation of this chapter or any part thereof, including failing to stop-work upon order, shall be charged with a misdemeanor and punished as set forth in city code of ordinances, as amended from time to time. Each day such violation continues after due notice to discontinue such violation shall be considered a separate offense.
                        - paragraph [ref=e1947]: (b)
                        - paragraph [ref=e1948]: In addition to any proceedings under the foregoing provision of this chapter, the city attorney may institute injunctive, mandamus or other appropriate action or proceedings at law or equity for the enforcement of this chapter or to correct violations of this chapter, and any court of competent jurisdiction shall have the right to issue restraining orders, temporary or permanent injunctions, mandamus or other appropriate forms of remedy or relief. Such remedies include the issuance of citations for misdemeanors, as appropriate, for violations of this chapter by the city public works director or his duly appointed designee.
                        - paragraph [ref=e1949]: (Ord. No. 2015-05-04(D), 5/4/15)
