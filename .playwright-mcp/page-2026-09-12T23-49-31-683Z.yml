                        - paragraph [ref=e1299]: (b)
                        - paragraph [ref=e1300]: "No final occupancy permit shall be issued without the following items:"
                        - paragraph [ref=e1301]: (1)
                        - paragraph [ref=e1302]: Recorded easements for stormwater drainage systems, management facilities, and BMPs (see sample agreement in Appendix C as incorporated by reference only);
                        - paragraph [ref=e1303]: (2)
                        - paragraph [ref=e1304]:
                          - text: An as-built plan signed and sealed by a registered professional (as outlined in Article II,
                          - link "section 3-6-18" [ref=e1305] [cursor=pointer]:
                            - /url: https://library.municode.com/sc/conway/codes/code_of_ordinances?nodeId=TIT3PUWO_CH6STMASECO_ARTIIAPPRSTMASTMASECOPL_S3-6-18PRRERE
                          - text: ) to be submitted upon completion of the stormwater management facilities. The registered professional shall state that the facilities have been constructed as shown on the "as-built" plan, and that the facilities meet the approved permit drawings and specifications or achieve the function for which they were designed.
                        - paragraph [ref=e1306]: (3)
                        - paragraph [ref=e1307]: A signed City of Conway Stormwater Practices Permanent Maintenance Covenants.
                        - paragraph [ref=e1308]: (c)
                        - paragraph [ref=e1309]: In addition to the plans and permits required from the city, owners shall obtain all state and federal permits required for the proposed development.
                        - paragraph [ref=e1310]: (Ord. No. 2015-05-04(D), 5/4/15)
