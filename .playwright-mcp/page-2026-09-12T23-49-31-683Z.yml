                      - generic [ref=e862]:
                        - paragraph [ref=e863]: (a)
                        - paragraph [ref=e864]: Unless granted an exemption from this chapter, a stormwater master plan for each land disturbing activity shall be submitted for review by the city public works director or his duly appointed designee prior to submission of the stormwater management and sediment control plan and construction plans for the entire land disturbing activity, or any portion thereof.
                        - paragraph [ref=e865]: (b)
                        - paragraph [ref=e866]: The stormwater master plan may be reviewed, if needed, with the designer, after city review, where it will be approved, approved with changes or rejected. If rejected, changes, additional analysis, or other information needed to approve the next submittal of the master plan shall be identified. The city review of the stormwater master plan will be completed within 20 working days from and after the receipt of the plan.
                        - paragraph [ref=e867]: (c)
                        - paragraph [ref=e868]: Upon approval of the master plan, the owner of a project that disturbs one (1) acre or greater, or that disturbs one-half (½) acre or greater and is located within one-half (½) mile of a receiving waterbody, must submit a stormwater management and sediment control plan, prepared in accordance with the Stormwater Design Manuals (as part of the construction plans). The owner is also required to submit a copy of the stormwater management and sediment and erosion control plan review checklist for design professionals that is submitted to SCDHEC.
                        - paragraph [ref=e869]: (d)
                        - paragraph [ref=e870]: All plans which are subject to approval by the City of Conway planning commission shall be submitted to the planning department and shall be subject to the review and approval time frames established by the planning commission. The required set of plans will correspond to those established by the planning department. These plans shall not be forwarded to the city planning commission for their review and consideration until the stormwater management and sediment control plans have been approved by the city public works director or his duly appointed designee.
                        - paragraph [ref=e871]: (e)
                        - paragraph [ref=e872]: All other stormwater management and sediment control plans as required by this chapter shall be submitted to the city public works director or his duly appointed designee for review and approval. The owner shall submit three (3) copies of the final plans in accordance with the Stormwater Design Manuals. Within 30 calendar days from and after receipt of the plans, the city public works director or his duly appointed designee shall issue a decision approving, rejecting, or conditionally approving the plans with modifications. The review and approval time frames for all subsequent submittals on the same plans, if required, shall also be 30 calendar days.
                        - paragraph [ref=e873]: (f)
                        - paragraph [ref=e874]: All preliminary plats of the development shall be consistent with the stormwater master plan required in subsection (a) of this section.
                        - paragraph [ref=e875]: (g)
                        - paragraph [ref=e876]: Should any stormwater management and sediment control plan involve any stormwater management facilities or land to be dedicated to public use, the same information shall also be submitted for review and approval to the department having jurisdiction over the land or other appropriate departments or agencies identified by the city engineer for review and approval. This stormwater management and sediment control plan shall serve as the basis for all subsequent construction.
                        - paragraph [ref=e877]: (h)
                        - paragraph [ref=e878]: A stormwater management and sediment control plan shall not be considered approved without the inclusion of an approval stamp with a signature and date on the plans. The stamp of approval on the plans is solely an acknowledgement of satisfactory compliance with the requirements of these regulations. The approval stamp does not constitute a representation or warranty to the owner or any other person concerning the safety, appropriateness or effectiveness of any provision, or omission from the stormwater management and sediment control plan.
                        - paragraph [ref=e879]: (i)
                        - paragraph [ref=e880]: Approved stormwater management and sediment control plans remain valid for five (5) years from the date of an approval or the time limits specified in the development agreement, (adopted according to section 6-31-10 of the South Carolina Code of Laws) whichever is longer. Extensions or renewals of the plan approvals may be granted by the city public works director or his duly appointed designee upon written request by the person responsible for the land disturbing activity.
                        - paragraph [ref=e881]: (Ord. No. 2015-05-04(D), 5/4/15)
