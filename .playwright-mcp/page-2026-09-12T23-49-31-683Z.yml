                      - generic [ref=e905]:
                        - paragraph [ref=e906]: (a)
                        - paragraph [ref=e907]: "Master plan. Master plans shall include as a minimum the following:"
                        - paragraph [ref=e908]: (1)
                        - paragraph [ref=e909]: A narrative description of topographic and soil conditions, hydrologic conditions of the upstream drainage basin, and the condition of the downstream drainage system (outfall) from the development site;
                        - paragraph [ref=e910]: (2)
                        - paragraph [ref=e911]: A narrative description of the stormwater management facilities to be used;
                        - paragraph [ref=e912]: (3)
                        - paragraph [ref=e913]: A general description of adjacent property and a description of existing structures, buildings, and other fixed improvements located on surrounding properties;
                        - paragraph [ref=e914]: (4)
                        - paragraph [ref=e915]: "A plan to accompany the narrative which shall contain:"
                        - paragraph [ref=e916]: a.
                        - paragraph [ref=e917]: A vicinity map, using the appropriate USGS quadrangle sheet, showing the location of the proposed project in relation to roadways, jurisdictional boundaries, streams and rivers,
                        - paragraph [ref=e918]: b.
                        - paragraph [ref=e919]: The maximum scale shall be one (1) inch equals 200 feet or other scale approved by the city public works director or his duly appointed designee in order to properly delineate the property,
                        - paragraph [ref=e920]: c.
                        - paragraph [ref=e921]: The boundary lines of the site on which the work is to be performed,
                        - paragraph [ref=e922]: d.
                        - paragraph [ref=e923]: All areas within the site which will be included in the land disturbing activities shall be identified and the total disturbed area calculated,
                        - paragraph [ref=e924]: e.
                        - paragraph [ref=e925]: A topographic map of the site showing existing and proposed contours,
                        - paragraph [ref=e926]: f.
                        - paragraph [ref=e927]: Anticipated starting and completion dates of the various stages of land disturbing activities and the expected date the final stabilization will be completed,
                        - paragraph [ref=e928]: g.
                        - paragraph [ref=e929]: Location of all existing stormwater conveyances, within the study area, such as ditches, storm pipes, easements, etc.
                        - paragraph [ref=e930]: h.
                        - paragraph [ref=e931]: The location of proposed temporary and permanent vegetative and structural stormwater management control measures, BMPs, and easements,
                        - paragraph [ref=e932]: i.
                        - paragraph [ref=e933]: Location and configuration of existing and proposed impervious areas such as buildings, roadways, etc. (for single-family developments, road and lot layout is sufficient),
                        - paragraph [ref=e934]: j.
                        - paragraph [ref=e935]:
                          - text: To be approved as the final stormwater management and sediment control plan by the city public works director or his duly appointed designee, the master plan must be signed and sealed by a professional as outlined in
                          - link "section 3-6-18" [ref=e936] [cursor=pointer]:
                            - /url: https://library.municode.com/sc/conway/codes/code_of_ordinances?nodeId=TIT3PUWO_CH6STMASECO_ARTIIAPPRSTMASTMASECOPL_S3-6-18PRRERE
                          - text: of this chapter - Professional Registration Requirements.
                        - paragraph [ref=e937]: (5)
                        - paragraph [ref=e938]: To be approved by the city public works director or his duly appointed designee as the final stormwater management and sediment control plan, the master plan shall contain a statement that the land disturbing activity will be accomplished pursuant to the master plan and that the city has the right to conduct on-site inspections.
                        - paragraph [ref=e939]: (b)
                        - paragraph [ref=e940]: "Stormwater management and sediment control plan. Stormwater management and sediment control plans shall include as a minimum the following (see example checklist in Appendix B as incorporated by reference only):"
                        - paragraph [ref=e941]: (1)
                        - paragraph [ref=e942]: A vicinity map, using the appropriate USGS quadrangle sheet, indicating a north arrow, scale, boundary lines of the site, and other information necessary to locate the development site such as wetlands, buffers, floodplains and streams;
                        - paragraph [ref=e943]: (2)
                        - paragraph [ref=e944]: The maximum scale shall be one (1) inch equals 100 feet;
                        - paragraph [ref=e945]: (3)
                        - paragraph [ref=e946]: The existing and proposed topography and tree and forest cover of the development site except for individual lot grading plans in single-family subdivisions.
                        - paragraph [ref=e947]: (4)
                        - paragraph [ref=e948]: Physical improvements on the site, including present development and proposed development;
                        - paragraph [ref=e949]: (5)
                        - paragraph [ref=e950]: Location, dimensions, elevations, and characteristics of all existing and proposed stormwater management facilities;
                        - paragraph [ref=e951]: (6)
                        - paragraph [ref=e952]: All areas within the site, which will be included in the land disturbing activities, shall be identified and the total disturbed area calculated;
                        - paragraph [ref=e953]: (7)
                        - paragraph [ref=e954]: The location of BMPs for stormwater quality and sediment control including temporary and permanent vegetative and structural measures;
                        - paragraph [ref=e955]: (8)
                        - paragraph [ref=e956]: An anticipated starting and completion date of the various stages of land disturbing activities and the expected date the final stabilization will be completed;
                        - paragraph [ref=e957]: (9)
                        - paragraph [ref=e958]: A determination that no occupied first floor elevation of any structure is below the 100-year plus one (1) foot flood elevation;
                        - paragraph [ref=e959]: (10)
                        - paragraph [ref=e960]: For subdivisions, directional arrows should be shown on the plan for each planned lot in the subdivision to show the drainage direction. The direction of flow cannot be changed without a revision to the plan;
                        - paragraph [ref=e961]: (11)
                        - paragraph [ref=e962]: "Stormwater management and sediment control plans shall include designation of all easements needed for inspection and maintenance of the drainage system and stormwater management facilities and BMPs. As a minimum, easements shall have the following characteristics:"
                        - paragraph [ref=e963]: a.
                        - paragraph [ref=e964]: Provide adequate access to all portions of the drainage system, stormwater management structures and BMPs,
                        - paragraph [ref=e965]: b.
                        - paragraph [ref=e966]: Provide sufficient land area for maintenance equipment and personnel to adequately and efficiently maintain the system, as outlined in the Stormwater Design Manuals,
                        - paragraph [ref=e967]: c.
                        - paragraph [ref=e968]: Restriction on easements shall include prohibiting all fences and structures, which would interfere with access to the easement areas and/or the maintenance function of the drainage system,
                        - paragraph [ref=e969]: d.
                        - paragraph [ref=e970]: Long-term maintenance plan describing the responsible party, types of maintenance activities anticipated, and schedule for performing maintenance activities;
                        - paragraph [ref=e971]: (12)
                        - paragraph [ref=e972]: "To improve the aesthetic aspects of the drainage system, a landscape plan for all portions of the drainage system shall be part of the stormwater management and sediment control plan. This landscape plan shall address the following:"
                        - paragraph [ref=e973]: a.
                        - paragraph [ref=e974]: Tree saving and planting plan,
                        - paragraph [ref=e975]: b.
                        - paragraph [ref=e976]: Types of vegetation that will be used for stream bank stabilization, erosion control, sediment control, aesthetics and water quality improvement,
                        - paragraph [ref=e977]: c.
                        - paragraph [ref=e978]: Any special requirements related to the landscaping of the drainage system and efforts necessary to preserve the natural aspects of the drainage system;
                        - paragraph [ref=e979]: (13)
                        - paragraph [ref=e980]: The stormwater management and sediment control plan shall include all engineering calculations needed to design the system and associated structures including predevelopment and developed velocities, peak rates of discharge, and hydrographs of stormwater runoff at all predevelopment and proposed points of discharge from the site;
                        - paragraph [ref=e981]: (14)
                        - paragraph [ref=e982]: Description of site conditions around points of all surface water discharge including vegetation and method of flow conveyance from the land disturbing activity;
                        - paragraph [ref=e983]: (15)
                        - paragraph [ref=e984]: Construction and design details for structural controls;
                        - paragraph [ref=e985]: (16)
                        - paragraph [ref=e986]: "If the city public works director or his duly appointed designee's review of the stormwater management and sediment control plan and/or design report indicates that there may be a drainage or flooding problem at the exit to the proposed development, or at any location between the exit point and the 10 percent downstream point, the city public works director or his duly appointed designee may require:"
                        - paragraph [ref=e987]: a.
                        - paragraph [ref=e988]: Water surface profiles plotted for the conditions of predevelopment and developed conditions for the 25-year design storm,
                        - paragraph [ref=e989]: b.
                        - paragraph [ref=e990]: Water surface profiles plotted for the conditions of predevelopment and developed conditions for the 100-year design storm, and
                        - paragraph [ref=e991]: c.
                        - paragraph [ref=e992]: Elevations of all structures potentially damaged by 25- and/or 100-year flows;
                        - paragraph [ref=e993]: (17)
                        - paragraph [ref=e994]: All stormwater management and sediment control plans submitted for approval shall contain a statement by the person responsible for the land disturbing activity that the land disturbing activity will be accomplished pursuant to the approved plan and that responsible personnel will be assigned to the project;
                        - paragraph [ref=e995]: (18)
                        - paragraph [ref=e996]: All stormwater management and sediment control plans shall contain a statement by the person responsible for the land disturbing activity, of the right of the city public works director or his duly appointed designee to conduct on-site inspections.
                        - paragraph [ref=e997]: (Ord. No. 2015-05-04(D), 5/4/15)
