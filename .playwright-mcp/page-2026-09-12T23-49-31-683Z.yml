                              - generic [ref=e1625]: 
                              - generic [ref=e1626]: Email section
                      - generic [ref=e1628]:
                        - paragraph [ref=e1629]: All temporary and permanent on-site stormwater management facilities and BMPs required by this chapter shall be adequately maintained, in a preventive fashion when possible, by the owner during and after site development, unless the facility is officially accepted by city for city maintenance. For purposes of this section, the term owner shall also mean homeowner's association (HOA) or other collective member organizations. A signed City of Conway Stormwater Practices Permanent Maintenance Covenants must be submitted with the permit application. Prior to the final inspection conducted by the city public works director or his duly appointed designee upon completion of the work included in the approved stormwater management and sediment control plan, the owner shall submit a long-term maintenance plan and schedule, including anticipated maintenance activities and inspection frequency.
                        - paragraph [ref=e1630]: (a)
                        - paragraph [ref=e1631]: Facilities maintained by the owner shall provide adequate access to permit the city to inspect and, if necessary, to take corrective action.
                        - paragraph [ref=e1632]: (b)
                        - paragraph [ref=e1633]: Facilities maintained by the city shall be designed and constructed consistent with the requirements of this chapter and dedicated to the city by deed with attached record drawings and a one-year warranty for defects in materials and workmanship. A letter of credit or a maintenance bond shall be provided to the city in an amount equivalent to 10 percent of the cost of the improvements dedicated to the city. Such letter of credit or maintenance bond shall be held by the city for a one (1) year period following dedication of said improvements to the city.
                        - paragraph [ref=e1634]: (Ord. No. 2015-05-04(D), 5/4/15)
